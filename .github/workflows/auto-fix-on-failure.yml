name: 🚨 Auto-Fix on CI Failure

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches:
      - claude/project-repo-clarification-bavpp0

jobs:
  check-and-fix:
    name: 🔍 Check Failure & Auto-Fix
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'failure'

    steps:
      - name: ✅ Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm install

      - name: 🔄 Auto-Fix Prisma Migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        continue-on-error: true
        run: |
          echo "🚨 CI failed, attempting auto-fix..."
          echo ""
          echo "🔧 Step 1: Resolving 1_add_analytics_tables migration..."
          npx prisma migrate resolve --rolled-back 1_add_analytics_tables || echo "⚠️ Could not resolve (might be normal)"

          echo ""
          echo "🔧 Step 2: Checking migration status..."
          npx prisma migrate status || echo "⚠️ Could not get status"

          echo ""
          echo "🔧 Step 3: Building application..."
          npm run build || echo "⚠️ Build failed"

          echo ""
          echo "✅ Auto-fix attempt completed"

      - name: 🔔 Notify via Issue Comment
        uses: actions/github-script@v7
        if: github.event.workflow_run.pull_requests.length > 0
        with:
          script: |
            const pr = github.event.workflow_run.pull_requests[0];
            github.rest.issues.createComment({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🤖 **Auto-fix triggered** due to CI failure\n\nAttempted to resolve migration: \`1_add_analytics_tables\`\n\nℹ️ If this continues to fail, ensure \`DATABASE_URL\` secret is configured in GitHub Settings → Secrets.`
            });
