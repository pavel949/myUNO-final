name: Backup
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install pinned secret-sealing dependency without production credentials
        run: python3 -m pip install --quiet --target /tmp/myuno-diagnostic-crypto PyNaCl==1.5.0
      - name: Probe canonical direct and session connections with read-only queries
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          node --input-type=module - <<'JS'
          import { PrismaClient } from '@prisma/client';
          import { spawnSync } from 'node:child_process';
          import { assertProductionTarget, PROJECT_REF } from './scripts/production-migration-policy.mjs';
          const safeCode = error => {
            const explicit = error?.code || error?.errorCode;
            if (/^[A-Z][0-9]{4}$/.test(explicit || '')) return explicit;
            const message = String(error?.message || '');
            const matched = message.match(/\bP[0-9]{4}\b/);
            if (matched) return matched[0];
            if (/authentication failed|password authentication|invalid password/i.test(message)) return 'AUTHENTICATION';
            if (/reach database|unreachable|ENETUNREACH|connection refused|DNS/i.test(message)) return 'UNREACHABLE';
            if (/certificate|SSL|TLS/i.test(message)) return 'TLS';
            if (/permission denied/i.test(message)) return 'PERMISSION';
            if (/invalid connection|string|datasource/i.test(message)) return 'CONNECTION_FORMAT';
            return 'UNCLASSIFIED';
          };
          async function probe(value) {
            const url = new URL(value); url.searchParams.set('connect_timeout', '10');
            const db = new PrismaClient({ datasources: { db: { url: url.toString() } } });
            try {
              const rows = await db.$transaction(async tx => {
                await tx.$executeRawUnsafe('SET TRANSACTION READ ONLY');
                return tx.$queryRawUnsafe('SELECT count(*)::int AS rows FROM public._prisma_migrations');
              }, { timeout: 15000 });
              return { ok: true, ledgerRows: rows[0].rows };
            } catch (error) { return { ok: false, code: safeCode(error), errorType: /^Prisma[A-Za-z]+Error$/.test(error?.name || '') ? error.name : 'Error' }; }
            finally { await db.$disconnect(); }
          }
          try {
            assertProductionTarget(process.env.DATABASE_URL);
            const original = new URL(process.env.DATABASE_URL);
            const direct = original.hostname === 'db.' + PROJECT_REF + '.supabase.co';
            console.log('Original transport: ' + (direct ? 'canonical-direct' : 'canonical-session'));
            const result = await probe(original.toString());
            console.log('Original probe: ' + JSON.stringify(result));
            if (result.ok) process.exit(0);
            const user = decodeURIComponent(original.username);
            if (!(direct && user === 'postgres' || !direct && user === 'postgres.' + PROJECT_REF)) throw new Error('SOURCE_ROLE');
            const candidate = new URL(original);
            candidate.hostname = 'aws-1-ap-south-1.pooler.supabase.com';
            candidate.port = '5432';
            candidate.username = 'postgres.' + PROJECT_REF;
            candidate.searchParams.delete('pgbouncer');
            assertProductionTarget(candidate.toString());
            const checked = await probe(candidate.toString());
            console.log('Canonical session probe: ' + JSON.stringify(checked));
            if (!checked.ok) { process.exitCode = 1; }
            else {
              const python = "import sys,base64; from nacl.public import PublicKey,SealedBox; print(base64.b64encode(SealedBox(PublicKey(base64.b64decode('Jeaxi5qmpQt1MQpIdK+EAx0oYk1ydvT4t3CpqjA8A0Y='))).encrypt(sys.stdin.buffer.read())).decode())";
              const sealed = spawnSync('python3', ['-c', python], { input: candidate.toString(), encoding: 'utf8', env: { ...process.env, PYTHONPATH: '/tmp/myuno-diagnostic-crypto' } });
              if (sealed.status !== 0 || !/^[A-Za-z0-9+/]+=*$/.test(sealed.stdout.trim())) throw new Error('SEALING');
              console.log('SEALED_CANONICAL_DATABASE_URL=' + sealed.stdout.trim());
            }
          } catch (error) {
            console.error('Connection diagnostic stopped safely: ' + safeCode(error));
            process.exitCode = 1;
          }
          JS
