document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-height: 19px; color: #7E8C88; margin: 0\">Step 04 becomes the expiry state: re-hold for 15 minutes, or back to results. Booking goes to <code style=\"font-family: Outfit; font-size: 11px\">expired<\u002Fcode>.<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 320px; background: #F6ECD8; border: 1px solid #D69A3A; border-radius: 8px; padding: 12px\"><p style=\"font-size: 13px; font-weight: 600; margin: 0 0 4px\">Cash on arrival<\u002Fp><p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 0\">Stays <code style=\"font-family: Outfit; font-size: 11px\">pending_payment<\u002Fcode> until staff record a receipt reference on the ops board. Check-in is disabled until then.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px\">\n      <h3 style=\"font-family: Outfit; font-size: 20px; font-weight: 600; margin: 0 0 4px\">F-SVC · In-stay service order<\u002Fh3>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 20px\">Ordered from the home space, so the stay, the unit and the project travel with the order and the provider never has to ask where to go.<\u002Fp>\n      <div style=\"display: flex; align-items: stretch; gap: 8px; overflow-x: auto; padding-bottom: 8px\">\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">01 · home space<\u002Fp><div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 8px\"><div style=\"height: 20px; background: #E6DFD1; border-radius: 4px\"><\u002Fdiv><div style=\"height: 20px; background: #DAD1BF; border-radius: 4px\"><\u002Fdiv><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Order a service<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Single-unit dashboard, no switcher<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px\">\n      <h3 style=\"font-family: Outfit; font-size: 20px; font-weight: 600; margin: 0 0 4px\">F-OWN-3 · Statement dispute<\u002Fh3>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 20px\">The dispute is a ticket, linked to the period it questions, and the payout it would settle cannot be approved while it is open.<\u002Fp>\n      <div style=\"display: flex; align-items: stretch; gap: 8px; overflow-x: auto; padding-bottom: 8px\">\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">01 · statement<\u002Fp><div style=\"height: 8px; background: #E6DFD1; border-radius: 4px; margin-bottom: 4px\"><\u002Fdiv><div style=\"height: 8px; background: #E6DFD1; border-radius: 4px; margin-bottom: 4px\"><\u002Fdiv><div style=\"height: 8px; background: #DAD1BF; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">A figure opened to its source lines<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #FBF8F1; border: 1px dashed #A7B2AE; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">02 · same screen<\u002Fp><div style=\"height: 32px; background: #E6DFD1; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Subject + what looks wrong<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">03 · ticket<\u002Fp><div style=\"height: 12px; background: #F6ECD8; border-radius: 4px; margin-bottom: 6px\"><\u002Fdiv><div style=\"height: 24px; background: #E6DFD1; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Opened, period attached<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">04 · admin disputes<\u002Fp><div style=\"height: 32px; background: #E6DFD1; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Trace, correct, or explain<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F6ECD8; border: 1px solid #D69A3A; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #B97F1F; margin: 0 0 8px\">05 · restatement<\u002Fp><div style=\"height: 24px; background: rgba(185,127,31,.2); border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Old one marked <code style=\"font-family: Outfit; font-size: 11px\">superseded<\u002Fcode><\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #E4EFE7; border: 1px solid #2F7A57; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #2F7A57; margin: 0 0 8px\">06 · signed off<\u002Fp><div style=\"height: 24px; background: rgba(47,122,87,.2); border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Payout unblocked<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px\">\n      <h3 style=\"font-family: Outfit; font-size: 20px; font-weight: 600; margin: 0 0 4px\">F-BUY · Buyer purchase process<\u002Fh3>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 20px\">The platform carries the relationship and the evidence trail; the transaction runs with Ignatev Capital off-platform. Nothing on screen asserts a legal position the system does not hold.<\u002Fp>\n      <div style=\"display: flex; align-items: stretch; gap: 8px; overflow-x: auto; padding-bottom: 8px\">\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">01 · saved unit<\u002Fp><div style=\"height: 32px; background: #E6DFD1; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Watching a home<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">02 · /buying<\u002Fp><div style=\"height: 32px; background: #E6DFD1; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Ask about buying<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">03 · thread<\u002Fp><div style=\"height: 12px; background: #E6DFD1; border-radius: 4px; width: 70%; margin-bottom: 6px\"><\u002Fdiv><div style=\"height: 12px; background: #E6DFD1; border-radius: 4px; width: 50%; margin-left: auto; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">A named person replies<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">04 · CRM<\u002Fp><div style=\"height: 12px; background: #E6DFD1; border-radius: 4px; margin-bottom: 6px\"><\u002Fdiv><div style=\"height: 24px; background: #E6DFD1; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Purchase opportunity, same party ID<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F6ECD8; border: 1px solid #D69A3A; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #B97F1F; margin: 0 0 8px\">05 · off-platform<\u002Fp><div style=\"height: 32px; background: rgba(185,127,31,.2); border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Due diligence, structure, contract<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #E4EFE7; border: 1px solid #2F7A57; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #2F7A57; margin: 0 0 8px\">06 · ownership period<\u002Fp><div style=\"height: 24px; background: rgba(47,122,87,.2); border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Buyer becomes owner · same profile<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px\">\n      <h3 style=\"font-family: Outfit; font-size: 20px; font-weight: 600; margin: 0 0 4px\">F-PROV · Provider application and vetting<\u002Fh3>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 20px\">Nothing a provider submits is visible to guests until a person approves it. Services carry their own review, separate from the company's.<\u002Fp>\n      <div style=\"display: flex; align-items: stretch; gap: 8px; overflow-x: auto; padding-bottom: 8px\">\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">01 · /providers<\u002Fp><div style=\"height: 32px; background: #E6DFD1; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Public page · Apply<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">02 · /provider/apply<\u002Fp><div style=\"height: 8px; background: #E6DFD1; border-radius: 4px; margin-bottom: 4px\"><\u002Fdiv><div style=\"height: 8px; background: #E6DFD1; border-radius: 4px; margin-bottom: 4px\"><\u002Fdiv><div style=\"height: 8px; background: #E6DFD1; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Company, licences, insurance, areas<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F6ECD8; border: 1px solid #D69A3A; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #B97F1F; margin: 0 0 8px\">03 · admin vetting<\u002Fp><div style=\"height: 24px; background: rgba(185,127,31,.2); border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\"><code style=\"font-family: Outfit; font-size: 11px\">applied<\u002Fcode> → <code style=\"font-family: Outfit; font-size: 11px\">vetting<\u002Fcode> → <code style=\"font-family: Outfit; font-size: 11px\">active<\u002Fcode><\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">04 · services editor<\u002Fp><div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 8px\"><div style=\"height: 20px; background: #E6DFD1; border-radius: 4px\"><\u002Fdiv><div style=\"height: 20px; background: #E6DFD1; border-radius: 4px\"><\u002Fdiv><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Submit services for review<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F6ECD8; border: 1px solid #D69A3A; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #B97F1F; margin: 0 0 8px\">05 · submissions<\u002Fp><div style=\"height: 24px; background: rgba(185,127,31,.2); border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Each service published or returned<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #E4EFE7; border: 1px solid #2F7A57; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #2F7A57; margin: 0 0 8px\">06 · live<\u002Fp><div style=\"height: 12px; background: rgba(47,122,87,.2); border-radius: 4px; width: 70%; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Vetted badge, order queue, remittance<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap\">\n        <div style=\"flex: 0 0 320px; background: #F5E4DF; border: 1px solid #AE4E38; border-radius: 8px; padding: 12px\"><p style=\"font-size: 13px; font-weight: 600; margin: 0 0 4px\">Rejected or suspended<\u002Fp><p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 0\">Existing accepted orders are honoured; nothing new is offered. The applicant sees the decision on their own status screen.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px\">\n      <h3 style=\"font-family: Outfit; font-size: 20px; font-weight: 600; margin: 0 0 4px\">F-CRM · Lead to opportunity to conversion<\u002Fh3>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 20px\">A request is never discarded because the right property is not managed. It takes one of three paths, and the third one is evidence for acquiring the asset.<\u002Fp>\n      <div style=\"display: flex; align-items: stretch; gap: 8px; overflow-x: auto; padding-bottom: 8px\">\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">01 · website lead<\u002Fp><div style=\"height: 32px; background: #E6DFD1; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Form + consent + source<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">02 · CRM profile<\u002Fp><div style=\"height: 12px; background: #E6DFD1; border-radius: 4px; margin-bottom: 6px\"><\u002Fdiv><div style=\"height: 24px; background: #E6DFD1; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">One party ID, lifecycle stage<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">03 · opportunity<\u002Fp><div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 3px; margin-bottom: 8px\"><div style=\"height: 20px; background: #DCEEEB; border-radius: 3px\"><\u002Fdiv><div style=\"height: 20px; background: #9CCFC8; border-radius: 3px\"><\u002Fdiv><div style=\"height: 20px; background: #5BA79E; border-radius: 3px\"><\u002Fdiv><div style=\"height: 20px; background: #0E4F4B; border-radius: 3px\"><\u002Fdiv><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Pipeline by type<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">04a · managed match<\u002Fp><div style=\"height: 32px; background: #E6DFD1; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Booking on managed inventory<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">04b · partner supply<\u002Fp><div style=\"height: 32px; background: #E6DFD1; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Disclosed responsibility + commission<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">04c · unmet demand<\u002Fp><div style=\"height: 32px; background: #E6DFD1; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Kept as qualified evidence<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #E4EFE7; border: 1px solid #2F7A57; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #2F7A57; margin: 0 0 8px\">05 · signals<\u002Fp><div style=\"height: 32px; background: rgba(47,122,87,.2); border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Which asset or mandate to go after<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px\">\n      <h3 style=\"font-family: Outfit; font-size: 20px; font-weight: 600; margin: 0 0 4px\">F-OPS · Incident and damage claim<\u002Fh3>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 20px\">The condition record is what makes a claim arguable. Photos are taken at check-in whether or not anyone expects a problem.<\u002Fp>\n      <div style=\"display: flex; align-items: stretch; gap: 8px; overflow-x: auto; padding-bottom: 8px\">\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">01 · check-in<\u002Fp><div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 8px\"><div style=\"height: 20px; background: #E6DFD1; border-radius: 4px\"><\u002Fdiv><div style=\"height: 20px; background: #E6DFD1; border-radius: 4px\"><\u002Fdiv><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Condition report captured<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">02 · incident<\u002Fp><div style=\"height: 12px; background: #F5E4DF; border-radius: 4px; margin-bottom: 6px\"><\u002Fdiv><div style=\"height: 24px; background: #E6DFD1; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Logged by staff or raised by guest<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">03 · check-out<\u002Fp><div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-bottom: 8px\"><div style=\"height: 20px; background: #F5E4DF; border-radius: 4px\"><\u002Fdiv><div style=\"height: 20px; background: #F5E4DF; border-radius: 4px\"><\u002Fdiv><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Before-and-after pairing<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">04 · /ops/claims<\u002Fp><div style=\"height: 32px; background: #E6DFD1; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Claim filed with an amount<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F6ECD8; border: 1px solid #D69A3A; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #B97F1F; margin: 0 0 8px\">05 · admin claims<\u002Fp><div style=\"height: 24px; background: rgba(185,127,31,.2); border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Approve, reduce or drop<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #E4EFE7; border: 1px solid #2F7A57; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #2F7A57; margin: 0 0 8px\">06 · ledger<\u002Fp><div style=\"height: 24px; background: rgba(47,122,87,.2); border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Deposit drawn, line on the statement<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap\">\n        <div style=\"flex: 0 0 320px; background: #F5E4DF; border: 1px solid #AE4E38; border-radius: 8px; padding: 12px\"><p style=\"font-size: 13px; font-weight: 600; margin: 0 0 4px\">Guest disputes the claim<\u002Fp><p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 0\">Opens a dispute against the claim, with both photo sets attached. The deposit is not drawn while it is open.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px\">\n      <h3 style=\"font-family: Outfit; font-size: 20px; font-weight: 600; margin: 0 0 4px\">F-ADM · Admin unit onboarding<\u002Fh3>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 20px\">The internal half of F-OWN-1, one screen per stage, each with its own save. A unit cannot go live with an incomplete availability and pricing panel.<\u002Fp>\n      <div style=\"display: flex; align-items: stretch; gap: 8px; overflow-x: auto; padding-bottom: 8px\">\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">01 · new unit<\u002Fp><div style=\"height: 32px; background: #E6DFD1; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Project, name, type, category<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">02 · engagement<\u002Fp><div style=\"height: 32px; background: #E6DFD1; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Managed, partner, or advisory scope<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">03 · media<\u002Fp><div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; margin-bottom: 8px\"><div style=\"height: 20px; background: #E6DFD1; border-radius: 3px\"><\u002Fdiv><div style=\"height: 20px; background: #E6DFD1; border-radius: 3px\"><\u002Fdiv><div style=\"height: 20px; background: #E6DFD1; border-radius: 3px\"><\u002Fdiv><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Cover + gallery, ordered<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">04 · availability<\u002Fp><div style=\"display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 8px\"><div style=\"height: 10px; background: #DCEEEB; border-radius: 2px\"><\u002Fdiv><div style=\"height: 10px; background: #9CCFC8; border-radius: 2px\"><\u002Fdiv><div style=\"height: 10px; background: #DCEEEB; border-radius: 2px\"><\u002Fdiv><div style=\"height: 10px; background: #0E4F4B; border-radius: 2px\"><\u002Fdiv><div style=\"height: 10px; background: #0E4F4B; border-radius: 2px\"><\u002Fdiv><div style=\"height: 10px; background: #DCEEEB; border-radius: 2px\"><\u002Fdiv><div style=\"height: 10px; background: #DCEEEB; border-radius: 2px\"><\u002Fdiv><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Rates, min nights, blocked dates<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F5EFE4; border: 1px solid #DAD1BF; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #7E8C88; margin: 0 0 8px\">05 · compliance<\u002Fp><div style=\"height: 8px; background: #E6DFD1; border-radius: 4px; margin-bottom: 4px\"><\u002Fdiv><div style=\"height: 8px; background: #E6DFD1; border-radius: 4px; margin-bottom: 4px\"><\u002Fdiv><div style=\"height: 8px; background: #F6ECD8; border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Checklist instance from a template<\u002Fp><\u002Fdiv>\n        <div style=\"flex: 0 0 24px; display: flex; align-items: center; justify-content: center; color: #A7B2AE\">→<\u002Fdiv>\n        <div style=\"flex: 0 0 168px; background: #F6ECD8; border: 1px solid #D69A3A; border-radius: 8px; padding: 12px\"><p style=\"font-size: 11px; color: #B97F1F; margin: 0 0 8px\">06 · publish<\u002Fp><div style=\"height: 24px; background: rgba(185,127,31,.2); border-radius: 4px; margin-bottom: 8px\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">Live, and searchable<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"f14\" style=\"padding: 40px 56px; border-top: 1px solid #DAD1BF\">\n  <p style=\"font-family: Outfit; font-weight: 500; font-size: 12px; letter-spacing: 2.88px; text-transform: uppercase; color: #D69A3A; margin: 0 0 8px\">14<\u002Fp>\n  <h2 style=\"font-family: Outfit; font-weight: 600; font-size: 28px; line-height: 34px; margin: 0 0 8px\">Onboarding screens<\u002Fh2>\n  <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; max-width: 720px; margin: 0 0 32px\">The three moments where somebody joins: a guest claiming the account a booking already created for them, an owner signing a mandate, a provider applying. Each one asks for the least it can and says what happens next.<\u002Fp>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start\">\n    <div>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 8px\">Guest · claim your account · mobile 390 · <em>recreated<\u002Fem><\u002Fp>\n      <div style=\"width: 390px; border: 1px solid #DAD1BF; border-radius: 12px; background: #F5EFE4; padding: 24px 16px\">\n        <div style=\"width: 48px; height: 48px; margin-bottom: 24px\"><svg width=\"48\" height=\"48\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0E4F4B\" stroke-width=\"1.5\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"3\" fill=\"#D69A3A\" stroke=\"none\"><\u002Fcircle><\u002Fsvg><\u002Fdiv>\n        <h1 style=\"font-family: Outfit; font-size: 28px; line-height: 34px; font-weight: 600; margin: 0 0 12px\">Set a password<\u002Fh1>\n        <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0 0 24px\">Your booking at Layan Green Park already created an account for anna@example.com. Choose a password and it is yours.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 16px; margin-bottom: 24px\">\n          <div style=\"display: flex; flex-direction: column; gap: 8px\"><label style=\"font-size: 13px; color: #7E8C88\">Password<\u002Flabel><div style=\"height: 48px; padding: 0 16px; border: 1px solid #E6DFD1; border-radius: 8px; background: #FBF8F1; display: flex; align-items: center; letter-spacing: 4px; color: #16211F\">••••••••••<\u002Fdiv><p style=\"font-size: 13px; color: #7E8C88; margin: 0\">At least 10 characters.<\u002Fp><\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px\"><label style=\"font-size: 13px; color: #7E8C88\">Repeat password<\u002Flabel><div style=\"height: 48px; padding: 0 16px; border: 1px solid #E6DFD1; border-radius: 8px; background: #FBF8F1; display: flex; align-items: center; letter-spacing: 4px\">••••••••••<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height: 48px; border-radius: 12px; background: #0E4F4B; color: #F5EFE4; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; margin-bottom: 16px\">Claim my account<\u002Fdiv>\n        <p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 0\">Next you will be asked for a passport photo for each guest, so we can file your TM30 before you arrive.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 8px\">Owner · mandate signing, step 3 of 4 · <em>new<\u002Fem><\u002Fp>\n      <div style=\"width: 620px; border: 1px solid #DAD1BF; border-radius: 12px; background: #F5EFE4; padding: 32px\">\n        <div style=\"display: flex; gap: 8px; margin-bottom: 24px\">\n          <div style=\"flex: 1; height: 4px; border-radius: 4px; background: #0E4F4B\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 4px; border-radius: 4px; background: #0E4F4B\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 4px; border-radius: 4px; background: #0E4F4B\"><\u002Fdiv>\n          <div style=\"flex: 1; height: 4px; border-radius: 4px; background: #E6DFD1\"><\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-family: Outfit; font-weight: 500; font-size: 12px; letter-spacing: 2.88px; text-transform: uppercase; color: #D69A3A; margin: 0 0 8px\">Step 3 of 4 · the commercial terms<\u002Fp>\n        <h1 style=\"font-family: Outfit; font-size: 28px; line-height: 34px; font-weight: 600; margin: 0 0 12px\">Your management agreement<\u002Fh1>\n        <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0 0 24px\">These are the terms your statements will be calculated from. Every figure below appears again, by name, on every statement you receive.<\u002Fp>\n        <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px; margin-bottom: 24px\">\n          <div style=\"display: flex; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid #E6DFD1\"><span style=\"font-size: 15px\">Unit<\u002Fspan><span style=\"font-size: 15px; font-weight: 600\">B-707 · Layan Green Park<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #E6DFD1\"><span style=\"font-size: 15px\">Performance fee<\u002Fspan><span style=\"font-family: Outfit; font-size: 15px; font-weight: 600\">30% of adjusted NOI<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #E6DFD1\"><span style=\"font-size: 15px\">Annual NOI cap<\u002Fspan><span style=\"font-family: Outfit; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums\">฿840,000<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #E6DFD1\"><span style=\"font-size: 15px\">Term<\u002Fspan><span style=\"font-family: Outfit; font-size: 15px; font-weight: 600\">24 months from 1 Feb 2026<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #E6DFD1\"><span style=\"font-size: 15px\">Owner stays<\u002Fspan><span style=\"font-family: Outfit; font-size: 15px; font-weight: 600\">Up to 30 nights a year, free<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; padding-top: 12px\"><span style=\"font-size: 15px\">Statements<\u002Fspan><span style=\"font-family: Outfit; font-size: 15px; font-weight: 600\">Monthly, by the 8th<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #E3ECEA; border-radius: 12px; padding: 16px; margin-bottom: 24px\">\n          <p style=\"font-size: 15px; line-height: 23px; color: #0E4F4B; margin: 0\">The cap is the one term owners most often meet unexpectedly. If a period's NOI exceeds ฿840,000, your share is limited and the statement will say so in those words \u002Fspan>\n            <span style=\"padding: 4px 10px; border-radius: 9999px; background: #F5EFE4; font-size: 13px\">UnitMedia<\u002Fspan>\n            <span style=\"padding: 4px 10px; border-radius: 9999px; background: #F5EFE4; font-size: 13px\">ProjectMedia<\u002Fspan>\n            <span style=\"padding: 4px 10px; border-radius: 9999px; background: #F5EFE4; font-size: 13px\">AnalyticsEvent<\u002Fspan>\n            <span style=\"padding: 4px 10px; border-radius: 9999px; background: #F5EFE4; font-size: 13px\">MetricDaily<\u002Fspan>\n            <span style=\"padding: 4px 10px; border-radius: 9999px; background: #F5EFE4; font-size: 13px\">IntegrationAccount<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <h3 style=\"font-family: Outfit; font-size: 20px; font-weight: 600; margin: 0 0 4px\">State machines · the enums behind every status chip<\u002Fh3>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 20px\">Colour comes from the §3.4 mapping, never chosen per screen. Terminal states are the ones a person cannot move out of in the UI.<\u002Fp>\n      <div style=\"display: flex; flex-direction: column; gap: 20px\">\n        <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px\">\n          <p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 16px\">BookingStatus<\u002Fp>\n          <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px\">\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F6ECD8; color: #B97F1F; font-size: 13px; font-weight: 500\">requested<\u002Fspan><span style=\"color: #A7B2AE\">→<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F6ECD8; color: #B97F1F; font-size: 13px; font-weight: 500\">pending_payment<\u002Fspan><span style=\"color: #A7B2AE\">→<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #E4EFE7; color: #2F7A57; font-size: 13px; font-weight: 500\">confirmed<\u002Fspan><span style=\"color: #A7B2AE\">→<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #E3ECEA; color: #0E4F4B; font-size: 13px; font-weight: 500\">checked_in<\u002Fspan><span style=\"color: #A7B2AE\">→<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #E3ECEA; color: #0E4F4B; font-size: 13px; font-weight: 500\">checked_out<\u002Fspan><span style=\"color: #A7B2AE\">→<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #FBF8F1; border: 1px solid #E6DFD1; color: #7E8C88; font-size: 13px; font-weight: 500\">completed<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap\">\n            <span style=\"font-size: 13px; color: #7E8C88\">Exits:<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F5E4DF; color: #AE4E38; font-size: 13px; font-weight: 500\">declined<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F5E4DF; color: #AE4E38; font-size: 13px; font-weight: 500\">expired<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F5E4DF; color: #AE4E38; font-size: 13px; font-weight: 500\">cancelled<\u002Fspan>\n            <span style=\"font-size: 13px; color: #7E8C88; margin-left: 8px\">Hold expiry produces <code style=\"font-family: Outfit; font-size: 13px\">expired<\u002Fcode>; a cash booking sits at <code style=\"font-family: Outfit; font-size: 13px\">pending_payment<\u002Fcode> until staff record the receipt.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px\">\n          <p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 16px\">ServiceOrderStatus<\u002Fp>\n          <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px\">\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F6ECD8; color: #B97F1F; font-size: 13px; font-weight: 500\">placed<\u002Fspan><span style=\"color: #A7B2AE\">→<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #E4EFE7; color: #2F7A57; font-size: 13px; font-weight: 500\">paid<\u002Fspan><span style=\"color: #A7B2AE\">→<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #E3ECEA; color: #0E4F4B; font-size: 13px; font-weight: 500\">accepted<\u002Fspan><span style=\"color: #A7B2AE\">→<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #E4EFE7; color: #2F7A57; font-size: 13px; font-weight: 500\">fulfilled<\u002Fspan><span style=\"color: #A7B2AE\">→<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #FBF8F1; border: 1px solid #E6DFD1; color: #7E8C88; font-size: 13px; font-weight: 500\">closed<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap\">\n            <span style=\"font-size: 13px; color: #7E8C88\">Exits:<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F5E4DF; color: #AE4E38; font-size: 13px; font-weight: 500\">declined<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F5E4DF; color: #AE4E38; font-size: 13px; font-weight: 500\">expired<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F5E4DF; color: #AE4E38; font-size: 13px; font-weight: 500\">cancelled<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F5E4DF; color: #AE4E38; font-size: 13px; font-weight: 500\">failed<\u002Fspan>\n            <span style=\"font-size: 13px; color: #7E8C88; margin-left: 8px\">A cron expires anything unanswered past the accept SLA.<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px\">\n          <p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 16px\">TicketStatus<\u002Fp>\n          <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px\">\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F6ECD8; color: #B97F1F; font-size: 13px; font-weight: 500\">open<\u002Fspan><span style=\"color: #A7B2AE\">→<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #E3ECEA; color: #0E4F4B; font-size: 13px; font-weight: 500\">acknowledged<\u002Fspan><span style=\"color: #A7B2AE\">→<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F6ECD8; color: #B97F1F; font-size: 13px; font-weight: 500\">in_progress<\u002Fspan><span style=\"color: #A7B2AE\">⇄<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F6ECD8; color: #B97F1F; font-size: 13px; font-weight: 500\">waiting_reporter<\u002Fspan><span style=\"color: #A7B2AE\">→<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #E4EFE7; color: #2F7A57; font-size: 13px; font-weight: 500\">resolved<\u002Fspan><span style=\"color: #A7B2AE\">→<\u002Fspan>\n            <span style=\"padding: 6px 12px; border-radius: 9999px; background: #FBF8F1; border: 1px solid #E6DFD1; color: #7E8C88; font-size: 13px; font-weight: 500\">closed<\u002Fspan>\n          <\u002Fdiv>\n          <p style=\"font-size: 13px; color: #7E8C88; margin: 0\">Also <span style=\"padding: 4px 10px; border-radius: 9999px; background: #F5E4DF; color: #AE4E38; font-size: 13px; font-weight: 500\">cancelled<\u002Fspan>. The reporter sees the same timeline staff see — every transition is a TicketEvent.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 20px; flex-wrap: wrap\">\n          <div style=\"flex: 1 1 380px; background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px\">\n            <p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 16px\">ProviderStatus<\u002Fp>\n            <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px\">\n              <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F6ECD8; color: #B97F1F; font-size: 13px; font-weight: 500\">applied<\u002Fspan><span style=\"color: #A7B2AE\">→<\u002Fspan>\n              <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F6ECD8; color: #B97F1F; font-size: 13px; font-weight: 500\">vetting<\u002Fspan><span style=\"color: #A7B2AE\">→<\u002Fspan>\n              <span style=\"padding: 6px 12px; border-radius: 9999px; background: #E4EFE7; color: #2F7A57; font-size: 13px; font-weight: 500\">active<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap\">\n              <span style=\"font-size: 13px; color: #7E8C88\">Exits:<\u002Fspan>\n              <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F5E4DF; color: #AE4E38; font-size: 13px; font-weight: 500\">rejected<\u002Fspan>\n              <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F5E4DF; color: #AE4E38; font-size: 13px; font-weight: 500\">suspended<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"flex: 1 1 380px; background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px\">\n            <p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 16px\">OwnerStatement status<\u002Fp>\n messaging, the services marketplace at full depth, and the six admin lists. Same tokens, same patterns as everything above.<\u002Fp>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start\">\n\n    <div>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 8px\">/residence · what residents share · desktop 900 · <em>new<\u002Fem><\u002Fp>\n      <div style=\"width: 900px; border: 1px solid #DAD1BF; border-radius: 12px; background: #F5EFE4; padding: 32px\">\n        <h1 style=\"font-family: Outfit; font-size: 40px; line-height: 44px; font-weight: 600; margin: 0 0 8px\">Layan Green Park<\u002Fh1>\n        <p style=\"font-size: 15px; color: #7E8C88; margin: 0 0 32px\">What is happening in the building, and what your neighbours are deciding.<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: 1fr 300px; gap: 32px\">\n          <div>\n            <p style=\"font-family: Outfit; font-weight: 500; font-size: 12px; letter-spacing: 2.88px; text-transform: uppercase; color: #D69A3A; margin: 0 0 12px\">From the juristic person<\u002Fp>\n            <div style=\"display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px\">\n              <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px\">\n                <div style=\"display: flex; align-items: center; gap: 8px; margin-bottom: 8px\">\n                  <p style=\"font-family: Outfit; font-size: 20px; font-weight: 600; margin: 0\">Annual general meeting · 14 February<\u002Fp>\n                  <span style=\"padding: 4px 8px; border-radius: 9999px; background: #FBF8F1; border: 1px solid #E6DFD1; font-size: 11px; font-weight: 500; color: #7E8C88\">Official<\u002Fspan>\n                <\u002Fdiv>\n                <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0 0 12px\">Agenda, proxy forms and the audited accounts will be circulated two weeks ahead. Attendance in person or by proxy; the quorum
