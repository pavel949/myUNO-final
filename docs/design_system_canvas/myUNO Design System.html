-weight: 700; color: #0E4F4B; margin: 0 0 24px\">myUNO<\u002Fp>\n          <h1 style=\"font-family: Outfit; font-size: 28px; line-height: 34px; font-weight: 600; margin: 0 0 8px\">Create an account<\u002Fh1>\n          <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0 0 24px\">If you have stayed with us before, you already have one — <span style=\"color: #0E4F4B; font-weight: 500\">claim it instead<\u002Fspan>.<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px\">\n            <div style=\"display: flex; flex-direction: column; gap: 8px\"><label style=\"font-size: 13px; color: #7E8C88\">Full name<\u002Flabel><div style=\"height: 48px; padding: 0 16px; border: 1px solid #E6DFD1; border-radius: 8px; background: #FBF8F1; display: flex; align-items: center; font-size: 15px; color: #A7B2AE\">As on your passport<\u002Fdiv><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px\"><label style=\"font-size: 13px; color: #7E8C88\">Email<\u002Flabel><div style=\"height: 48px; padding: 0 16px; border: 1px solid #E6DFD1; border-radius: 8px; background: #FBF8F1; display: flex; align-items: center; font-size: 15px; color: #A7B2AE\">you@example.com<\u002Fdiv><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px\">\n              <label style=\"font-size: 13px; color: #7E8C88\">Password<\u002Flabel>\n              <div style=\"height: 48px; padding: 0 8px 0 16px; border: 1px solid #E6DFD1; border-radius: 8px; background: #FBF8F1; display: flex; align-items: center; justify-content: space-between; gap: 8px\">\n                <span style=\"font-size: 15px; letter-spacing: 4px\">••••••••••<\u002Fspan>\n                <span style=\"width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0\">\n                  <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#7E8C88\" stroke-width=\"1.5\"><path d=\"M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"2.5\"><\u002Fcircle><path d=\"M4 20L20 4\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n                <\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 4px\"><div style=\"flex: 1; height: 4px; border-radius: 4px; background: #2F7A57\"><\u002Fdiv><div style=\"flex: 1; height: 4px; border-radius: 4px; background: #2F7A57\"><\u002Fdiv><div style=\"flex: 1; height: 4px; border-radius: 4px; background: #2F7A57\"><\u002Fdiv><div style=\"flex: 1; height: 4px; border-radius: 4px; background: #E6DFD1\"><\u002Fdiv><\u002Fdiv>\n              <p style=\"font-size: 13px; color: #7E8C88; margin: 0\">At least 10 characters. Strong.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height: 48px; border-radius: 12px; background: #0E4F4B; color: #F5EFE4; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; margin-bottom: 16px\">Create account<\u002Fdiv>\n          <p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 0\">We will send a link to confirm the address. No marketing unless you ask for it.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"width: 320px; border: 1px solid #DAD1BF; border-radius: 12px; background: #F5EFE4; padding: 24px 16px\">\n          <p style=\"font-family: Outfit; font-size: 20px; font-weight: 700; color: #0E4F4B; margin: 0 0 24px\">myUNO<\u002Fp>\n          <div style=\"width: 48px; height: 48px; margin-bottom: 20px\"><svg width=\"48\" height=\"48\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0E4F4B\" stroke-width=\"1.5\"><rect x=\"3\" y=\"6\" width=\"18\" height=\"12\" rx=\"2\"><\u002Frect><path d=\"M3 8l9 6 9-6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <h1 style=\"font-family: Outfit; font-size: 28px; line-height: 34px; font-weight: 600; margin: 0 0 12px\">Check your email<\u002Fh1>\n          <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0 0 24px\">We sent a confirmation link to <strong style=\"color: #16211F\">anna@example.com<\u002Fstrong>. It is good for 24 hours.<\u002Fp>\n          <div style=\"height: 48px; border: 1px solid #E6DFD1; border-radius: 12px; background: #FBF8F1; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 500; margin-bottom: 16px\">Send it again<\u002Fdiv>\n          <p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 0\">Wrong address? <span style=\"color: #0E4F4B; font-weight: 500\">Change it<\u002Fspan> and we will resend.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"width: 320px; border: 1px solid #DAD1BF; border-radius: 12px; background: #F5EFE4; padding: 24px 16px\">\n          <p style=\"font-family: Outfit; font-size: 20px; font-weight: 700; color: #0E4F4B; margin: 0 0 24px\">myUNO<\u002Fp>\n          <h1 style=\"font-family: Outfit; font-size: 28px; line-height: 34px; font-weight: 600; margin: 0 0 12px\">Set a new password<\u002Fh1>\n          <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0 0 24px\">Choose something you have not used elsewhere. Setting it signs out every other device.<\u002Fp>\n          <div style=\"display: flex; flex-direction: column; gap: 16px; margin-bottom: 20px\">\n            <div style=\"display: flex; flex-direction: column; gap: 8px\"><label style=\"font-size: 13px; color: #7E8C88\">New password<\u002Flabel><div style=\"height: 48px; padding: 0 16px; border: 1px solid #E6DFD1; border-radius: 8px; background: #FBF8F1; display: flex; align-items: center; letter-spacing: 4px\">••••••••••••<\u002Fdiv><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px\"><label style=\"font-size: 13px; color: #7E8C88\">Repeat it<\u002Flabel><div style=\"height: 48px; padding: 0 16px; border: 1px solid #AE4E38; border-radius: 8px; background: #FBF8F1; display: flex; align-items: center; letter-spacing: 4px\">••••••••<\u002Fdiv><p style=\"font-size: 13px; color: #AE4E38; margin: 0\">These do not match<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height: 48px; border-radius: 12px; background: #0E4F4B; color: #F5EFE4; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; opacity: .5\">Set password<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 8px 0 0; max-width: 1180px\">Every auth screen sits on ivory with a paper form, one column, 320–390 wide on mobile and centred at 420 on desktop. <strong style=\"color: #16211F\">Google sign-in is offered first<\u002Fstrong>, above the divider — most guests arrive on a phone and will not type a password on a beach. It works because the platform links identities by <em>verified<\u002Fem> email: a Google account whose verified address matches an existing identity signs into that identity and inherits its bookings and roles. If the address is new, it creates one exactly as the email path would. A Google account whose address is unverified is refused, because that link is the whole mechanism. Password fields carry a 44px eye toggle that reveals in place and re-hides after 15 seconds — typing a 10-character password blind on a phone is the single most common reason people abandon the claim flow — and registration shows strength as four segments rather than a rule the person has to satisfy by guessing.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"flex: 1 1 100%\">\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 8px\">Owner onboarding · the full four steps · desktop 1100 · <em>new<\u002Fem><\u002Fp>\n      <div style=\"width: 1100px; border: 1px solid #DAD1BF; border-radius: 12px; background: #F5EFE4; padding: 32px\">\n        <div style=\"display: flex; align-items: center; gap: 0; margin-bottom: 32px\">\n          <div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px\"><div style=\"height: 4px; border-radius: 4px; background: #0E4F4B\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">1 · Your account<\u002Fp><p style=\"font-size: 13px; color: #2F7A57; margin: 0\">Done<\u002Fp><\u002Fdiv>\n          <div style=\"width: 16px\"><\u002Fdiv>\n          <div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px\"><div style=\"height: 4px; border-radius: 4px; background: #0E4F4B\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">2 · Your unit<\u002Fp><p style=\"font-size: 13px; color: #2F7A57; margin: 0\">Done<\u002Fp><\u002Fdiv>\n          <div style=\"width: 16px\"><\u002Fdiv>\n          <div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px\"><div style=\"height: 4px; border-radius: 4px; background: #0E4F4B\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; margin: 0\">3 · The terms<\u002Fp><p style=\"font-size: 13px; color: #0E4F4B; margin: 0\">You are here<\u002Fp><\u002Fdiv>\n          <div style=\"width: 16px\"><\u002Fdiv>\n          <div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px\"><div style=\"height: 4px; border-radius: 4px; background: #E6DFD1\"><\u002Fdiv><p style=\"font-size: 13px; font-weight: 600; color: #A7B2AE; margin: 0\">4 · Getting paid<\u002Fp><p style=\"font-size: 13px; color: #A7B2AE; margin: 0\">Next<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr 320px; gap: 32px\">\n          <div>\n            <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px; margin-bottom: 16px\">\n              <p style=\"font-family: Outfit; font-size: 20px; font-weight: 600; margin: 0 0 4px\">Step 2 · Your unit<\u002Fp>\n              <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 16px\">Confirmed 4 January. What we hold on file:<\u002Fp>\n              <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px\">\n                <div><p style=\"font-size: 13px; color: #7E8C88; margin: 0\">Unit<\u002Fp><p style=\"font-size: 15px; margin: 0\">B-707 · Layan Green Park<\u002Fp><\u002Fdiv>\n                <div><p style=\"font-size: 13px; color: #7E8C88; margin: 0\">Type<\u002Fp><p style=\"font-size: 15px; margin: 0\">Two-bedroom garden villa<\u002Fp><\u002Fdiv>\n                <div><p style=\"font-size: 13px; color: #7E8C88; margin: 0\">Title document<\u002Fp><p style=\"font-size: 15px; margin: 0\">Received · verified 3 Jan<\u002Fp><\u002Fdiv>\n                <div><p style=\"font-size: 13px; color: #7E8C88; margin: 0\">Permitted use<\u002Fp><p style=\"font-size: 15px; color: #B97F1F; font-weight: 600; margin: 0\">Awaiting the juristic person<\u002Fp><\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #FBF8F1; border: 1px solid #0E4F4B; border-radius: 16px; padding: 24px\">\n              <p style=\"font-family: Outfit; font-size: 20px; font-weight: 600; margin: 0 0 4px\">Step 3 · The terms<\u002Fp>\n              <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0 0 20px\">These are what your statements will be calculated from. Every figure here appears again, by name, on every statement you receive.<\u002Fp>\n              <div style=\"display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #E6DFD1\"><span style=\"font-size: 15px\">Performance fee<\u002Fspan><span style=\"font-family: Outfit; font-size: 15px; font-weight: 600\">30% of adjusted NOI<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #E6DFD1\"><span style=\"font-size: 15px\">Annual NOI cap<\u002Fspan><span style=\"font-family: Outfit; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums\">฿840,000<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #E6DFD1\"><span style=\"font-size: 15px\">Term<\u002Fspan><span style=\"font-family: Outfit; font-size: 15px; font-weight: 600\">24 months from 1 Feb 2026<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #E6DFD1\"><span style=\"font-size: 15px\">Owner stays<\u002Fspan><span style=\"font-family: Outfit; font-size: 15px; font-weight: 600\">30 nights a year, free<\u002Fspan><\u002Fdiv>\n              <div style=\"display: flex; justify-content: space-between; padding: 12px 0; border-top: 1px solid #E6DFD1; border-bottom: 1px solid #E6DFD1\"><span style=\"font-size: 15px\">Statements<\u002Fspan><span style=\"font-family: Outfit; font-size: 15px; font-weight: 600\">Monthly, by the 8th<\u002Fspan><\u002Fdiv>\n              <div style=\"background: #E3ECEA; border-radius: 8px; padding: 16px; margin: 20px 0\">\n                <p style=\"font-size: 15px; line-height: 23px; color: #0E4F4B; margin: 0\">The cap is the term owners most often meet unexpectedly. If a period's NOI exceeds ฿840,000 your share is limited, and the statement says so in those words, with the number.<\u002Fp>\n              <\u002Fdiv>\n              <label style=\"display: flex; align-items: flex-start; gap: 12px; margin-bottom: 20px\">\n                <span style=\"width: 20px; height: 20px; border: 1px solid #0E4F4B; border-radius: 4px; background: #0E4F4B; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#F5EFE4\" stroke-width=\"3\"><path d=\"M5 13l4 4L19 7\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n                <span style=\"font-size: 15px; line-height: 23px\">I have read the agreement and these terms match what we discussed.<\u002Fspan>\n              <\u002Flabel>\n              <div style=\"display: flex; gap: 12px\">\n                <div style=\"height: 56px; padding: 0 32px; border-radius: 16px; background: #0E4F4B; color: #F5EFE4; display: flex; align-items: center; font-family: Outfit; font-size: 16px; font-weight: 500\">Sign and continue<\u002Fdiv>\n                <div style=\"height: 56px; padding: 0 32px; border: 1px solid #E6DFD1; border-radius: 16px; background: #FBF8F1; display: flex; align-items: center; font-family: Outfit; font-size: 16px; font-weight: 500\">Ask a question first<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px; margin-top: 16px; opacity: .55\">\n              <p style=\"font-family: Outfit; font-size: 20px; font-weight: 600; margin: 0 0 4px\">Step 4 · Getting paid<\u002Fp>\n              <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0\">Bank account, tax residency and the name payouts should be made to. Unlocks once the agreement is signed by both sides.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px; margin-bottom: 16px\">\n              <p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 12px\">Your contact<\u002Fp>\n              <div style=\"display: flex; align-items: center; gap: 12px; margin-bottom: 12px\">\n                <div style=\"width: 40px; height: 40px; border-radius: 9999px; background: #E6DFD1; display: flex; align-items: center; justify-content: center; font-family: Outfit; font-size: 20px; font-weight: 500\">PI<\u002Fdiv>\n                <div><p style=\"font-size: 15px; font-weight: 600; margin: 0\">Pavel Ignatev<\u002Fp><p style=\"font-size: 13px; color: #7E8C88; margin: 0\">Owner relations<\u002Fp><\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 0\">Nothing here is automated. If a term looks wrong, ask before you sign — changing it afterwards means a new agreement.<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px\">\n              <p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 12px\">Before B-707 goes live<\u002Fp>\n              <div style=\"display: flex; flex-direction: column; gap: 10px\">\n                <div style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 16px; height: 16px; border-radius: 9999px; background: #2F7A57; flex-shrink: 0\"><\u002Fspan><span style=\"font-size: 13px\">Title verified<\u002Fspan><\u002Fdiv>\n                <div style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 16px; height: 16px; border-radius: 9999px; background: #2F7A57; flex-shrink: 0\"><\u002Fspan><span style=\"font-size: 13px\">Photographs and description<\u002Fspan><\u002Fdiv>\n                <div style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 16px; height: 16px; border-radius: 9999px; background: #0E4F4B; flex-shrink: 0\"><\u002Fspan><span style=\"font-size: 13px; font-weight: 600\">Agreement signed<\u002Fspan><\u002Fdiv>\n                <div style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 16px; height: 16px; border-radius: 9999px; border: 2px solid #DAD1BF; flex-shrink: 0\"><\u002Fspan><span style=\"font-size: 13px; color: #7E8C88\">Payout account<\u002Fspan><\u002Fdiv>\n                <div style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 16px; height: 16px; border-radius: 9999px; border: 2px solid #DAD1BF; flex-shrink: 0\"><\u002Fspan><span style=\"font-size: 13px; color: #7E8C88\">Keys and inventory<\u002Fspan><\u002Fdiv>\n                <div style=\"display: flex; align-items: center; gap: 8px\"><span style=\"width: 16px; height: 16px; border-radius: 9999px; border: 2px solid #B97F1F; flex-shrink: 0\"><\u002Fspan><span style=\"font-size: 13px; color: #B97F1F\">Permitted use confirmed<\u002Fspan><\u002Fdiv>\n              <\u002Fdiv>\n              <p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 16px 0 0\">The same checklist appears on the admin side, so nobody has to ask where it stands.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 8px\">Staff · first login after a role grant · <em>new<\u002Fem><\u002Fp>\n      <div style=\"width: 520px; border: 1px solid #DAD1BF; border-radius: 12px; background: #F5EFE4; padding: 32px\">\n        <p style=\"font-family: Outfit; font-weight: 500; font-size: 12px; letter-spacing: 2.88px; text-transform: uppercase; color: #D69A3A; margin: 0 0 8px\">Step 2 of 2<\u002Fp>\n        <h1 style=\"font-family: Outfit; font-size: 28px; line-height: 34px; font-weight: 600; margin: 0 0 12px\">What you can see, and what is recorded<\u002Fh1>\n        <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0 0 24px\">You have been given the <strong style=\"color: #16211F\">operations<\u002Fstrong> role on <strong style=\"color: #16211F\">Layan Green Park<\u002Fstrong>. Before you start:<\u002Fp>\n        <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px; margin-bottom: 20px\">\n          <div style=\"display: flex; gap: 12px; padding-bottom: 16px; border-bottom: 1px solid #E6DFD1\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0E4F4B\" stroke-width=\"1.5\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M12 3l7 4v5c0 4-3 7-7 9-4-2-7-5-7-9V7z\"><\u002Fpath><\u002Fsvg>\n            <div><p style=\"font-size: 15px; font-weight: 600; margin: 0 0 2px\">Your scope is one project<\u002Fp><p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 0\">Bookings, tickets and guests at Layan Green Park. Other projects are not visible to you at all.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; padding: 16px 0; border-bottom: 1px solid #E6DFD1\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0E4F4B\" stroke-width=\"1.5\" style=\"flex-shrink: 0; margin-top: 2px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n            <div><p style=\"font-size: 15px; font-weight: 600; margin: 0 0 2px\">Passport access is logged with a reason<\u002Fp><p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 0\">Opening a guest's passport writes an audit entry with your name and the reason you gave. Guests can be told what it says.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; gap: 12px; padding-top: 16px\">\n            <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0E4F4B\" stroke-width=\"1.5\" style=\"flex-shrink: 0; margin-top: 2px\"><path d=\"M6 3h12v18l-6-4-6 4z\"><\u002Fpath><\u002Fsvg>\n            <div><p style=\"font-size: 15px; font-weight: 600; margin: 0 0 2px\">Cash needs a receipt reference<\u002Fp><p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 0\">You cannot record a cash payment without one, and the amount is confirmed before it posts.<\u002Fp><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <label style=\"display: flex; align-items: flex-start; gap: 12px; margin-bottom: 20px\">\n          <span style=\"width: 20px; height: 20px; border: 1px solid #0E4F4B; border-radius: 4px; background: #0E4F4B; flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#F5EFE4\" stroke-width=\"3\"><path d=\"M5 13l4 4L19 7\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <span style=\"font-size: 15px; line-height: 23px\">I understand and accept the data handling terms.<\u002Fspan>\n        <\u002Flabel>\n        <div style=\"height: 48px; width: 200px; border-radius: 12px; background: #0E4F4B; color: #F5EFE4; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600\">Go to today's board<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 8px\">Provider · after approval, the empty services state · <em>new<\u002Fem><\u002Fp>\n      <div style=\"width: 520px; border: 1px solid #DAD1BF; border-radius: 12px; background: #F5EFE4; padding: 32px\">\n        <div style=\"background: #E4EFE7; border-radius: 12px; padding: 16px; margin-bottom: 24px; display: flex; align-items: flex-start; gap: 12px\">\n          <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#2F7A57\" stroke-width=\"2\" style=\"flex-shrink: 0; margin-top: 2px\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M8 12l3 3 5-6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n          <div><p style=\"font-size: 15px; font-weight: 600; color: #2F7A57; margin: 0 0 2px\">Phuket Shine Co. is approved<\u002Fp><p style=\"font-size: 13px; line-height: 19px; color: #2F7A57; margin: 0\">You are a vetted provider for Layan, Bang Tao and Cherng Talay.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n        <h1 style=\"font-family: Outfit; font-size: 28px; line-height: 34px; font-weight: 600; margin: 0 0 24px\">Your services<\u002Fh1>\n        <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px; text-align: center\">\n          <svg width=\"48\" height=\"48\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#7E8C88\" stroke-width=\"1.5\" style=\"margin-bottom: 20px\"><path d=\"M4 7h16M4 12h10M4 17h6\"><\u002Fpath><\u002Fsvg>\n          <p style=\"font-family: Outfit; font-size: 16px; font-weight: 500; margin: 0 0 12px\">Nothing listed yet<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0 0 20px\">Add what you offer, how it is priced and how much notice you need. Each service is reviewed before it appears to guests — usually within a working day.<\u002Fp>\n          <div style=\"height: 48px; padding: 0 24px; border-radius: 12px; background: #0E4F4B; color: #F5EFE4; display: inline-flex; align-items: center; font-size: 15px; font-weight: 500\">Add your first service<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px; margin-top: 16px\">\n          <p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 12px\">How you get paid<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0\">Guests pay myUNO. We remit to you monthly against a statement showing every order, on the 8th. Cash orders are recorded by staff with a receipt reference and settled the same way.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"f19\" style=\"padding: 40px 56px; border-top: 1px solid #DAD1BF\">\n  <p style=\"font-family: Outfit; font-weight: 500; font-size: 12px; letter-spacing: 2.88px; text-transform: uppercase; color: #D69A3A; margin: 0 0 8px\">19<\u002Fp>\n  <h2 style=\"font-family: Outfit; font-weight: 600; font-size: 28px; line-height: 34px; margin: 0 0 8px\">Architecture &amp; the rules that keep it clean<\u002Fh2>\n  <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; max-width: 720px; margin: 0 0 32px\">A product this wide decays by accretion: a second way to show a status, a screen that invents its own empty state, a role checked in the UI instead of on the server. These six artefacts are the countermeasures. They are meant to be argued with and kept current, not admired.<\u002Fp>\n\n  <div style=\"display: flex; flex-direction: column; gap: 40px\">\n\n    <div>\n      <h3 style=\"font-family: Outfit; font-size: 20px; font-weight: 600; margin: 0 0 4px\">Sitemap<\u002Fh3>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 20px\">Five trees, one per audience. A route belongs to exactly one tree — that is what keeps the header menu honest.<\u002Fp>\n      <div style=\"display: flex; flex-wrap: wrap; gap: 16px\">\n        <div style=\"flex: 1 1 300px; background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px\">\n          <p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 4px\">Public · no account<\u002Fp>\n          <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 16px\">Indexed, cacheable, no personal data<\u002Fp>\n          <div style=\"font-family: Outfit; font-size: 13px; line-height: 22px; color: #16211F\">\n            <p style=\"margin: 0; font-weight: 600\">/<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">├ /search → /units/[id]<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">├ /projects → /projects/[slug]<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">├ /services → /services/[id]<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">├ /trust → /trust/ombudsman<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">├ /about<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">├ audience doors<\u002Fp>\n            <p style=\"margin: 0; padding-left: 32px; color: #7E8C88\">/owners /guests /buyers<\u002Fp>\n            <p style=\"margin: 0; padding-left: 32px; color: #7E8C88\">/developers /providers<\u002Fp>\n            <p style=\"margin: 0; padding-left: 32px; color: #7E8C88\">/management-companies<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">├ /legal/terms · /legal/privacy<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">└ /[vanitySlug] → a project<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 300px; background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px\">\n          <p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 4px\">Signed in · any role<\u002Fp>\n          <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 16px\">Personal. Present whatever else the person is<\u002Fp>\n          <div style=\"font-family: Outfit; font-size: 13px; line-height: 22px; color: #16211F\">\n            <p style=\"margin: 0; font-weight: 600\">/app <span style=\"font-family: Manrope; font-weight: 400; color: #7E8C88\">the router<\u002Fspan><\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">├ /trips → /trips/[id]<\u002Fp>\n            <p style=\"margin: 0; padding-left: 32px; color: #7E8C88\">→ /bookings/[id]/home-space<\u002Fp>\n            <p style=\"margin: 0; padding-left: 48px; color: #7E8C88\">→ /handbook<\u002Fp>\n            <p style=\"margin: 0; padding-left: 32px; color: #7E8C88\">→ /bookings/[id]/passports<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">├ /checkout/[sessionId]<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">├ /messages → /[threadId]<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">├ /tickets → /tickets/new<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">├ /services/orders → /[orderId]<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">├ /residence · /announcements<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">├ /buying<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">└ /account<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 300px; background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px\">\n          <p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 4px\">Role surfaces<\u002Fp>\n          <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 16px\">Offered only when a role resolves to them<\u002Fp>\n          <div style=\"font-family: Outfit; font-size: 13px; line-height: 22px; color: #16211F\">\n            <p style=\"margin: 0; font-weight: 600\">owner<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">└ /owner → /statements/[id]<\u002Fp>\n            <p style=\"margin: 0; font-weight: 600; padding-top: 8px\">provider<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">├ /provider · /provider/services<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">└ /provider/apply <span style=\"font-family: Manrope; color: #7E8C88\">no role yet<\u002Fspan><\u002Fp>\n            <p style=\"margin: 0; font-weight: 600; padding-top: 8px\">mc · juristic<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">├ /mc <span style=\"font-family: Manrope; color: #7E8C88\">5 tabs<\u002Fspan><\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">└ /juristic<\u002Fp>\n            <p style=\"margin: 0; font-weight: 600; padding-top: 8px\">staff · ops<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">└ /ops → /tm30 /claims /costs<\u002Fp>\n            <p style=\"margin: 0; font-weight: 600; padding-top: 8px\">any<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">└ /design <span style=\"font-family: Manrope; color: #7E8C88\">the living reference<\u002Fspan><\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"flex: 1 1 300px; background: #0A3733; border-radius: 16px; padding: 24px; color: #EAF2F0\">\n          <p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 4px\">Admin · /app/admin<\u002Fp>\n          <p style=\"font-size: 13px; color: #7FA39D; margin: 0 0 16px\">Own shell. Four groups, twenty destinations<\u002Fp>\n          <div style=\"font-family: Outfit; font-size: 13px; line-height: 22px\">\n            <p style=\"margin: 0; color: #E7C079\">Grow<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">crm → crm/opportunities/[id]<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">signals<\u002Fp>\n            <p style=\"margin: 0; color: #E7C079; padding-top: 8px\">Inventory<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">projects · units · people<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">bookings · config<\u002Fp>\n            <p style=\"margin: 0; color: #E7C079; padding-top: 8px\">Supply &amp; content<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">providers · services<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">announcements · content<\u002Fp>\n            <p style=\"margin: 0; color: #E7C079; padding-top: 8px\">Money &amp; record<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">ledger · statements · payouts<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">reconciliation · claims<\u002Fp>\n            <p style=\"margin: 0; padding-left: 16px\">disputes · audit · integrations<\u002Fp>\n          <\u002Fdiv>\n          <p style=\"font-size: 13px; line-height: 19px; color: #7FA39D; margin: 16px 0 0\">The sidebar today is one flat list of twenty. Grouping it in four named sections is the cheapest legibility win in the product.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <h3 style=\"font-family: Outfit; font-size: 20px; font-weight: 600; margin: 0 0 4px\">Permission matrix<\u002Fh3>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 20px\">Roles are scoped, so read this as \"against the thing they hold the role on\". The UI hides what a person cannot do; the server is what actually refuses. Both read this table.<\u002Fp>\n t-size: 20px; font-weight: 600; margin: 0 0 4px\">Naming conventions<\u002Fh3>\n        <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 20px\">Pick a convention once and the codebase reads itself.<\u002Fp>\n        <div style=\"display: grid; grid-template-columns: 160px 1fr; gap: 0 20px\">\n          <p style=\"font-size: 15px; font-weight: 600; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Routes<\u002Fp>\n          <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">lowercase, plural nouns, no verbs — <code style=\"font-family: Outfit; font-size: 13px\">/statements/[id]<\u002Fcode>, never <code style=\"font-family: Outfit; font-size: 13px\">/viewStatement<\u002Fcode><\u002Fp>\n          <p style=\"font-size: 15px; font-weight: 600; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Enums<\u002Fp>\n          <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\"><code style=\"font-family: Outfit; font-size: 13px\">snake_case<\u002Fcode>, past-tense where it is a state reached — <code style=\"font-family: Outfit; font-size: 13px\">checked_in<\u002Fcode>, <code style=\"font-family: Outfit; font-size: 13px\">signed_off<\u002Fcode>. Never rendered raw<\u002Fp>\n          <p style=\"font-size: 15px; font-weight: 600; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Content keys<\u002Fp>\n          <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\"><code style=\"font-family: Outfit; font-size: 13px\">surface.block.element<\u002Fcode> — <code style=\"font-family: Outfit; font-size: 13px\">landing.hero.title<\u002Fcode>, <code style=\"font-family: Outfit; font-size: 13px\">checkin.tm30.explainer<\u002Fcode><\u002Fp>\n          <p style=\"font-size: 15px; font-weight: 600; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Config<\u002Fp>\n          <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\"><code style=\"font-family: Outfit; font-size: 13px\">domain.thing_unit<\u002Fcode> — the unit is in the name, so nobody guesses minutes or hours<\u002Fp>\n          <p style=\"font-size: 15px; font-weight: 600; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Money<\u002Fp>\n          <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Integer satang everywhere, suffixed <code style=\"font-family: Outfit; font-size: 13px\">_satang<\u002Fcode>. Divided once, in MoneyAmount<\u002Fp>\n          <p style=\"font-size: 15px; font-weight: 600; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Components<\u002Fp>\n          <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Named for what they are, not where they sit — <code style=\"font-family: Outfit; font-size: 13px\">StatusChip<\u002Fcode>, not <code style=\"font-family: Outfit; font-size: 13px\">OwnerCardBadge<\u002Fcode><\u002Fp>\n          <p style=\"font-size: 15px; font-weight: 600; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Dates<\u002Fp>\n          <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Stored UTC, displayed in Asia/Bangkok, formatted per locale — never an ISO string on screen<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"flex: 1 1 480px; background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px\">\n        <h3 style=\"font-family: Outfit; font-size: 20px; font-weight: 600; margin: 0 0 4px\">Where a thing belongs<\u002Fh3>\n        <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 20px\">The question that causes the most duplication, answered once.<\u002Fp>\n        <div style=\"display: flex; flex-direction: column; gap: 16px\">\n          <div style=\"padding-bottom: 16px; border-bottom: 1px solid #E6DFD1\">\n            <p style=\"font-size: 15px; font-weight: 600; margin: 0 0 4px\">A number the user sees<\u002Fp>\n            <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0\">Computed server-side, always. Prices, totals, fees, SLA deadlines and countdowns are displayed, never derived in the browser — otherwise two clients disagree.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding-bottom: 16px; border-bottom: 1px solid #E6DFD1\">\n            <p style=\"font-size: 15px; font-weight: 600; margin: 0 0 4px\">A rule that changes by project<\u002Fp>\n            <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0\">A ConfigParameter with an override, not a branch in the code. If someone would ask \"can we do it differently at Kata?\", it is config.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding-bottom: 16px; border-bottom: 1px solid #E6DFD1\">\n            <p style=\"font-size: 15px; font-weight: 600; margin: 0 0 4px\">A string a person reads<\u002Fp>\n            <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0\">A content key. No literal copy in a component — that is what makes RU and TH a translation pass rather than a rebuild.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"padding-bottom: 16px; border-bottom: 1px solid #E6DFD1\">\n            <p style=\"font-size: 15px; font-weight: 600; margin: 0 0 4px\">A status<\u002Fp>\n            <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0\">An enum plus one mapping to label and colour, in one file. A second mapping anywhere is the bug.<\u002Fp>\n          <\u002Fdiv>\n          <div>\n            <p style=\"font-size: 15px; font-weight: 600; margin: 0 0 4px\">Anything consequential<\u002Fp>\n            <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0\">A human approval and an audit entry. Money moving, a role granted, a unit going live, a passport opened — never automatic, always attributable.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"background: #0A3733; border-radius: 16px; padding: 32px; color: #EAF2F0\">\n      <h3 style=\"font-family: Outfit; font-size: 20px; font-weight: 600; margin: 0 0 4px\">Nine rules<\u002Fh3>\n      <p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0 0 24px; max-width: 720px\">If a change breaks one of these, it needs an argument, not a shrug. Put them in the pull-request template.<\u002Fp>\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px 32px\">\n        <div><p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 6px\">1 · One identity<\u002Fp><p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0\">A person is one party ID across every journey. Never a second profile because the role changed.<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 6px\">2 · Roles are scoped<\u002Fp><p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0\">Always against a unit, project or organization. There is no global \"owner\".<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 6px\">3 · The menu is derived<\u002Fp><p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0\">Header and <code style=\"font-family: Outfit; font-size: 13px\">/app<\u002Fcode> read the same resolver, so they cannot drift.<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 6px\">4 · Satang, divided once<\u002Fp><p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0\">Integers in the database, one formatter at the boundary.<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 6px\">5 · Figures trace<\u002Fp><p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0\">Any money shown to an owner opens to the rows behind it, or it should not be shown.<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 6px\">6 · Records are append-only<\u002Fp><p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0\">Ledger and statements are never edited. A correction is a new entry that supersedes.<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 6px\">7 · Never a blank screen<\u002Fp><p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0\">Empty, loading and error ship together, with copy written for that surface.<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 6px\">8 · Say what happens next<\u002Fp><p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0\">Every confirmation states the consequence in numbers before the person commits.<\u002Fp><\u002Fdiv>\n        <div><p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 6px\">9 · Absent, not zero<\u002Fp><p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0\">Unknown shows nothing. A unit nobody reviewed has no rating, not a zero.<\u002Fp><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"f20\" style=\"padding: 40px 56px; border-top: 1px solid #DAD1BF\">\n  <p style=\"font-family: Outfit; font-weight: 500; font-size: 12px; letter-spacing: 2.88px; text-transform: uppercase; color: #D69A3A; margin: 0 0 8px\">20<\u002Fp>\n  <h2 style=\"font-family: Outfit; font-weight: 600; font-size: 28px; line-height: 34px; margin: 0 0 8px\">Mobile counterparts<\u002Fh2>\n  <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; max-width: 720px; margin: 0 0 32px\">The eight surfaces that were desktop-only, at 390. Ops leads, because staff work on a phone with one hand while standing at a door. Three rules govern every one: tables become key-value cards, the primary action for the current row becomes a fixed bottom bar, and anything requiring typed input opens as a sheet rather than shrinking into the row.<\u002Fp>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start\">\n\n    <div>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 8px\">Ops · today · <em>new<\u002Fem><\u002Fp>\n      <div style=\"width: 390px; border: 1px solid #DAD1BF; border-radius: 12px; background: #F5EFE4; overflow: hidden\">\n        <div style=\"background: #0E4F4B; color: #F5EFE4; padding: 16px\">\n          <p style=\"font-size: 13px; margin: 0 0 4px\">Layan operations<\u002Fp>\n          <h1 style=\"font-family: Outfit; font-size: 28px; line-height: 34px; font-weight: 600; margin: 0 0 4px\">Today<\u002Fh1>\n          <p style=\"font-size: 13px; color: #7FA39D; margin: 0\">Mon 4 Jan · 3 arrivals · 2 departures · 1 unpaid<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display: flex; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #E6DFD1; background: #FBF8F1; overflow: hidden\">\n          <div style=\"padding: 8px 14px; border-radius: 9999px; background: #0E4F4B; color: #F5EFE4; font-size: 13px; font-weight: 500; white-space: nowrap\">Arrivals 3<\u002Fdiv>\n          <div style=\"padding: 8px 14px; border-radius: 9999px; background: #FBF8F1; border: 1px solid #E6DFD1; font-size: 13px; font-weight: 500; white-space: nowrap\">Departures 2<\u002Fdiv>\n          <div style=\"padding: 8px 14px; border-radius: 9999px; background: #FBF8F1; border: 1px solid #E6DFD1; font-size: 13px; font-weight: 500; white-space: nowrap\">Cash 2<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n          <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 16px\">\n            <p style=\"font-size: 15px; font-weight: 600; margin: 0 0 2px\">Anna Sokolova<\u002Fp>\n            <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 12px\">B-707 · 2 guests · 04–12 Jan · ฿36,600<\u002Fp>\n            <div style=\"display: flex; gap: 8px; margin-bottom: 12px\">\n              <span style=\"padding: 6px 12px; border-radius: 9999px; background: #E4EFE7; color: #2F7A57; font-size: 13px; font-weight: 500\">Paid<\u002Fspan>\n              <span style=\"padding: 6px 12px; border-radius: 9999px; background: #E4EFE7; color: #2F7A57; font-size: 13px; font-weight: 500\">Verified<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height: 48px; border-radius: 12px; background: #0E4F4B; color: #F5EFE4; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600\">Check in<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 16px\">\n            <p style=\"font-size: 15px; font-weight: 600; margin: 0 0 2px\">Michael Chen<\u002Fp>\n            <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 12px\">A-204 · 4 guests · 04–07 Jan · ฿18,400<\u002Fp>\n            <div style=\"display: flex; gap: 8px; margin-bottom: 12px\">\n              <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F6ECD8; color: #B97F1F; font-size: 13px; font-weight: 500\">Unpaid<\u002Fspan>\n              <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F6ECD8; color: #B97F1F; font-size: 13px; font-weight: 500\">Not verified<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height: 48px; border-radius: 12px; background: #0E4F4B; color: #F5EFE4; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; opacity: .5; margin-bottom: 8px\">Check in<\u002Fdiv>\n            <p style=\"font-size: 13px; color: #B97F1F; margin: 0\">Take payment first — tap Cash below.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 16px\">\n            <p style=\"font-size: 15px; font-weight: 600; margin: 0 0 2px\">Jonas Weber<\u002Fp>\n            <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 12px\">Villa Kata 3 · 6 guests · 04–11 Jan · ฿92,000<\u002Fp>\n            <div style=\"display: flex; gap: 8px; margin-bottom: 12px\">\n              <span style=\"padding: 6px 12px; border-radius: 9999px; background: #E4EFE7; color: #2F7A57; font-size: 13px; font-weight: 500\">Paid<\u002Fspan>\n              <span style=\"padding: 6px 12px; border-radius: 9999px; background: #F6ECD8; color: #B97F1F; font-size: 13px; font-weight: 500\">Not verified<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"height: 48px; border-radius: 12px; background: #0E4F4B; color: #F5EFE4; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600\">Check in<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 8px\">Ops · record cash, as a sheet · <em>new<\u002Fem><\u002Fp>\n      <div style=\"width: 390px; border: 1px solid #DAD1BF; border-radius: 12px; background: rgba(10,55,51,.5); overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; min-height: 620px\">\n        <div style=\"background: #FBF8F1; border-radius: 16px 16px 0 0; padding: 24px 16px\">\n          <div style=\"width: 40px; height: 4px; border-radius: 4px; background: #DAD1BF; margin: 0 auto 20px\"><\u002Fdiv>\n          <h2 style=\"font-family: Outfit; font-size: 20px; font-weight: 600; margin: 0 0 4px\">Record cash · Michael Chen<\u002Fh2>\n          <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 20px\">A-204 · booking BK-2026-0121<\u002Fp>\n          <div style=\"background: #F5EFE4; border-radius: 12px; padding: 16px; margin-bottom: 16px\">\n            <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 4px\">Amount due<\u002Fp>\n            <p style=\"font-family: Outfit; font-size: 28px; font-weight: 600; margin: 0; font-variant-numeric: tabular-nums\">฿18,400<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px\">\n            <label style=\"font-size: 13px; color: #7E8C88\">Receipt number <span style=\"color: #AE4E38\">*<\u002Fspan><\u002Flabel>\n            <div style=\"height: 48px; padding: 0 16px; border: 1px solid #E6DFD1; border-radius: 8px; background: #FBF8F1; display: flex; align-items: center; font-family: Outfit; font-size: 15px; color: #A7B2AE\">RC-2026-____<\u002Fdiv>\n            <p style=\"font-size: 13px; color: #7E8C88; margin: 0\">From the paper receipt book at the desk.<\u002Fp>\n          <\u002Fdiv>\n          <label style=\"display: flex; align-items: flex-start; gap: 12px; margin-bottom: 20px\">\n            <span style=\"width: 20px; height: 20px; border: 1px solid #DAD1BF; border-radius: 4px; background: #FBF8F1; flex-shrink: 0; margin-top: 2px\"><\u002Fspan>\n            <span style=\"font-size: 15px; line-height: 23px\">I have counted ฿18,400 and it is in the safe.<\u002Fspan>\n          <\u002Flabel>\n          <div style=\"height: 48px; border-radius: 12px; background: #D69A3A; color: #0A3733; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; opacity: .5; margin-bottom: 8px\">Record ฿18,400 cash<\u002Fdiv>\n          <p style=\"font-size: 13px; color: #7E8C88; margin: 0; text-align: center\">Both the reference and the count are required.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 8px\">Owner dashboard · <em>new<\u002Fem><\u002Fp>\n      <div style=\"width: 390px; border: 1px solid #DAD1BF; border-radius: 12px; background: #F5EFE4; overflow: hidden\">\n        <div style=\"padding: 24px 16px 0\">\n          <h1 style=\"font-family: Outfit; font-size: 28px; line-height: 34px; font-weight: 600; margin: 0 0 4px\">Owner dashboard<\u002Fh1>\n          <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 20px\">B-707 · Layan Green Park<\u002Fp>\n          <div style=\"background: #F5E4DF; border: 1px solid #AE4E38; border-radius: 12px; padding: 16px; margin-bottom: 8px\">\n            <p style=\"font-size: 15px; font-weight: 600; margin: 0 0 4px\">Permitted use not confirmed<\u002Fp>\n            <p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 0 0 12px\">Bookings continue; the record is incomplete.<\u002Fp>\n            <div style=\"height: 40px; padding: 0 16px; border: 1px solid #E6DFD1; border-radius: 12px; background: #FBF8F1; display: inline-flex; align-items: center; font-size: 13px; font-weight: 500\">View<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background: #F6ECD8; border: 1px solid #B97F1F; border-radius: 12px; padding: 16px; margin-bottom: 24px\">\n            <p style=\"font-size: 15px; font-weight: 600; margin: 0 0 4px\">Statement awaiting your review<\u002Fp>\n            <p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 0 0 12px\">December 2025, published 8 January.<\u002Fp>\n            <div style=\"height: 40px; padding: 0 16px; border: 1px solid #E6DFD1; border-radius: 12px; background: #FBF8F1; display: inline-flex; align-items: center; font-size: 13px; font-weight: 500\">View<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px\">\n            <div style=\"border-radius: 12px; padding: 16px; background: #FBF8F1; border-left: 4px solid #0E4F4B\">\n              <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 4px\">Occupancy this month<\u002Fp>\n
