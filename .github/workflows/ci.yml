name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: myuno_test
        options: >-
          --health-cmd "pg_isready -U test -d myuno_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Wait for PostgreSQL
        run: |
          max_attempts=30
          attempt=0
          until [ $attempt -ge $max_attempts ]; do
            if pg_isready -h localhost -p 5432 -U test -d myuno_test; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Waiting for PostgreSQL... (attempt $((attempt + 1))/$max_attempts)"
            sleep 2
            ((attempt++))
          done
          if [ $attempt -ge $max_attempts ]; then
            echo "PostgreSQL failed to start"
            exit 1
          fi

      # Runs the real migration chain, the same way production deploys do, and
      # before the build so the schema exists when Next.js prerenders pages that
      # read from the database. Applying the schema after the build was why CI
      # failed on `relation "public.translation" does not exist`.
      #
      # `migrate deploy` rather than `db push`: CLAUDE.md fixes the stack on
      # migration files, never db-push, and pushing the schema meant CI never
      # exercised the migrations. A migration chain that could not apply from
      # scratch therefore stayed green here while every deployment failed.
      - name: Apply migrations to test database
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/myuno_test
        run: npx prisma migrate deploy
        timeout-minutes: 5

      # next build must run as a production compile. Setting NODE_ENV=development
      # here mixed Next's prod and dev runtimes and failed prerender of /404,
      # /500, /_not-found, /legal and /design with
      # "<Html> should not be imported outside of pages/_document".
      # CONTENT_REVIEW_GATE_ENABLED=false is the CI-safe way to skip the
      # founder-review gate without poisoning NODE_ENV.
      - name: Build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/myuno_test
          DATABASE_URL_TEST: postgresql://test:test@localhost:5432/myuno_test
          CONTENT_REVIEW_GATE_ENABLED: 'false'
          NEXTAUTH_SECRET: test-secret
          NEXTAUTH_URL: http://localhost:3000
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: npm run build

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/myuno_test
          DATABASE_URL_TEST: postgresql://test:test@localhost:5432/myuno_test
          NEXTAUTH_SECRET: test-secret
          NEXTAUTH_URL: http://localhost:3000
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        run: |
          set -o pipefail
          npx vitest run 2>&1 | tee test-output.log
        timeout-minutes: 10
