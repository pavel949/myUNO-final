name: Approved ancestor production migration
on:
  workflow_dispatch:
    inputs:
      preflight_only:
        description: 'Read-only verification only; no backup or migration'
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: production-release
  cancel-in-progress: false
jobs:
  reviewed-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Require exact control CI and approved ancestor CI
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: be5843c04f4d36e5edb00bd49984df1473869df0
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [ "$current" = "$GITHUB_SHA" ]
          for sha in "$GITHUB_SHA" "$RELEASE_SHA"; do
            passed="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=success&per_page=10" --jq '[.workflow_runs[] | select(.event == "push" and .head_branch == "main")] | length')"
            [ "$passed" -gt 0 ]
          done
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/$RELEASE_SHA...$GITHUB_SHA" --jq '.status')"
          [ "$status" = ahead ] || [ "$status" = identical ]
  preflight:
    needs: reviewed-release
    runs-on: ubuntu-latest
    environment: production
    outputs:
      host: ${{ steps.route.outputs.host }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: be5843c04f4d36e5edb00bd49984df1473869df0
          path: release
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: release/package-lock.json
      - run: npm ci
        working-directory: release
      - run: node --test control/scripts/scoped-release-policy.test.mjs
      - name: Verify backup route without credential output
        id: route
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          import { backupConnection } from './release/scripts/backup-policy.mjs';
          try {
            const { PGHOST } = backupConnection(process.env.BACKUP_DATABASE_URL);
            appendFileSync(process.env.GITHUB_OUTPUT, `host=${PGHOST}\n`);
          } catch { console.error('Canonical backup route rejected'); process.exitCode = 1; }
          JS
      - name: Read-only approved release preflight
        env:
          READONLY_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node control/scripts/scoped-production-migrate.mjs preflight
  backup:
    needs: preflight
    if: ${{ !inputs.preflight_only }}
    uses: ./.github/workflows/backup.yml
    with:
      source_sha: be5843c04f4d36e5edb00bd49984df1473869df0
    secrets:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
  migrate:
    needs: [preflight, backup]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: control
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: be5843c04f4d36e5edb00bd49984df1473869df0
          path: release
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: release/package-lock.json
      - run: npm ci
        working-directory: release
      - run: node --test control/scripts/scoped-release-policy.test.mjs
      - name: Recheck control main after backup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          [ "$current" = "$GITHUB_SHA" ]
      - name: Apply only the approved ancestor migration chain
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MIGRATION_DATABASE_HOST: ${{ needs.preflight.outputs.host }}
          BACKUP_VERIFIED_SHA: ${{ needs.backup.outputs.verified_source_sha }}
        run: node control/scripts/scoped-production-migrate.mjs migrate
