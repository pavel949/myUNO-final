: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 16px\">What changes between desktop and 390, as a rule<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: 200px 1fr; gap: 0 24px\">\n      <p style=\"font-size: 15px; font-weight: 600; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Tables<\u002Fp>\n      <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Become key-value cards. Never a horizontal scroller for data a person must act on.<\u002Fp>\n      <p style=\"font-size: 15px; font-weight: 600; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Row actions<\u002Fp>\n      <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Move inside the card at full width, 48px tall. The disabled reason is printed underneath rather than left to a tooltip.<\u002Fp>\n      <p style=\"font-size: 15px; font-weight: 600; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Typed input<\u002Fp>\n      <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Opens as a sheet — cash receipt, dispute, order note. A 160px field wedged into a row is how mistakes get typed.<\u002Fp>\n      <p style=\"font-size: 15px; font-weight: 600; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Kanban and tabs<\u002Fp>\n      <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Kanban becomes a filtered list with the stage as a select. Tabs become a chip scroller.<\u002Fp>\n      <p style=\"font-size: 15px; font-weight: 600; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Charts<\u002Fp>\n      <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">One chart, single-letter axis labels, table toggle kept. Six bars is the most that reads at this width.<\u002Fp>\n      <p style=\"font-size: 15px; font-weight: 600; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Navigation<\u002Fp>\n      <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">The admin sidebar becomes an index that leads with what is waiting on a person; empty groups collapse.<\u002Fp>\n      <p style=\"font-size: 15px; font-weight: 600; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">The one primary action<\u002Fp>\n      <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Pins to a fixed bottom bar when the page scrolls past it — reserve, book my own stay, sign off.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"f21\" style=\"padding: 40px 56px; border-top: 1px solid #DAD1BF\">\n  <p style=\"font-family: Outfit; font-weight: 500; font-size: 12px; letter-spacing: 2.88px; text-transform: uppercase; color: #D69A3A; margin: 0 0 8px\">21<\u002Fp>\n  <h2 style=\"font-family: Outfit; font-weight: 600; font-size: 28px; line-height: 34px; margin: 0 0 8px\">Russian<\u002Fh2>\n  <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; max-width: 720px; margin: 0 0 32px\">The guest journey end to end in Russian — the majority language of myUNO's owners and a large share of its guests. Cyrillic runs 15–30% longer than English at the same point size, and the words that grow most are the ones on buttons. Every screen here is the same layout as its English counterpart; where something had to give, it is noted.<\u002Fp>\n\n  <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 24px; max-width: 1180px; margin: 0 0 32px\">\n    <p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 4px\">Where it actually hurts<\u002Fp>\n    <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 20px\">Measured on the real strings, not an average.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: 200px 1fr 1fr 80px; gap: 0 24px\">\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 12px\">String<\u002Fp>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 12px\">EN<\u002Fp>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 12px\">RU<\u002Fp>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 12px; text-align: right\">Δ<\u002Fp>\n      <p style=\"font-size: 15px; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Search CTA<\u002Fp>\n      <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Find your stay<\u002Fp>\n      <p style=\"font-size: 15px; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Найти жильё<\u002Fp>\n      <p style=\"font-family: Outfit; font-size: 15px; color: #2F7A57; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1; text-align: right\">−13%<\u002Fp>\n      <p style=\"font-size: 15px; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Booking CTA<\u002Fp>\n      <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Reserve<\u002Fp>\n      <p style=\"font-size: 15px; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Забронировать<\u002Fp>\n      <p style=\"font-family: Outfit; font-size: 15px; color: #AE4E38; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1; text-align: right\">+86%<\u002Fp>\n      <p style=\"font-size: 15px; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Statement status<\u002Fp>\n      <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Awaiting your review<\u002Fp>\n      <p style=\"font-size: 15px; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Ожидает вашей проверки<\u002Fp>\n      <p style=\"font-family: Outfit; font-size: 15px; color: #B97F1F; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1; text-align: right\">+15%<\u002Fp>\n      <p style=\"font-size: 15px; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Ops action<\u002Fp>\n      <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Check in<\u002Fp>\n      <p style=\"font-size: 15px; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Заселить<\u002Fp>\n      <p style=\"font-family: Outfit; font-size: 15px; color: #B97F1F; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1; text-align: right\">+11%<\u002Fp>\n      <p style=\"font-size: 15px; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Ops action<\u002Fp>\n      <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Record cash<\u002Fp>\n      <p style=\"font-size: 15px; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Принять наличные<\u002Fp>\n      <p style=\"font-family: Outfit; font-size: 15px; color: #AE4E38; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1; text-align: right\">+45%<\u002Fp>\n      <p style=\"font-size: 15px; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Field label<\u002Fp>\n      <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Check-out<\u002Fp>\n      <p style=\"font-size: 15px; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Дата выезда<\u002Fp>\n      <p style=\"font-family: Outfit; font-size: 15px; color: #AE4E38; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1; text-align: right\">+27%<\u002Fp>\n      <p style=\"font-size: 15px; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Kicker<\u002Fp>\n      <p style=\"font-size: 15px; color: #7E8C88; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Serviced living in Phuket<\u002Fp>\n      <p style=\"font-size: 15px; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1\">Жизнь с сервисом на Пхукете<\u002Fp>\n      <p style=\"font-family: Outfit; font-size: 15px; color: #AE4E38; margin: 0; padding: 10px 0; border-top: 1px solid #E6DFD1; text-align: right\">+15%<\u002Fp>\n    <\u002Fdiv>\n    <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 20px 0 0; max-width: 720px\">Three consequences. Buttons cannot be sized to their English label — width comes from content plus padding, with a min-width, never a fixed px. The kicker's 2.88px letter-spacing pushes a 15%-longer string past two lines at 390, so it loses the tracking below <code style=\"font-family: Outfit; font-size: 13px\">md<\u002Fcode> in RU. And status chips need to wrap rather than truncate: a truncated status is a status you cannot read.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start\">\n\n    <div>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 8px\">S1 · Главная · mobile 390 · <em>new<\u002Fem><\u002Fp>\n      <div style=\"width: 390px; border: 1px solid #DAD1BF; border-radius: 12px; background: #fff; overflow: hidden\">\n        <div style=\"height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: #FBF8F1; border-bottom: 1px solid #E6DFD1\">\n          <span style=\"font-family: Outfit; font-size: 20px; font-weight: 700; color: #0E4F4B\">myUNO<\u002Fspan>\n          <div style=\"display: flex; align-items: center; gap: 8px\">\n            <span style=\"font-size: 13px; color: #7E8C88\">RU ▾<\u002Fspan>\n            <div style=\"width: 44px; height: 44px; display: flex; align-items: center; justify-content: center\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M4 7h16M4 12h16M4 17h16\" stroke=\"#16211F\" stroke-width=\"2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: linear-gradient(135deg, #0E4F4B, #0A3733); color: #F5EFE4; padding: 40px 16px\">\n          <p style=\"font-family: Outfit; font-weight: 500; font-size: 12px; line-height: 18px; text-transform: uppercase; color: #E7C079; margin: 0 0 16px\">Жизнь с сервисом на Пхукете<\u002Fp>\n          <h1 style=\"font-family: Outfit; font-size: 40px; line-height: 44px; letter-spacing: -0.4px; font-weight: 600; margin: 0 0 16px\">Ваш дом.<\u002Fh1>\n          <p style=\"font-size: 15px; line-height: 23px; color: rgba(245,239,228,.9); margin: 0 0 24px\">Перестаньте управлять — начните жить. Один портал для всего.<\u002Fp>\n          <div style=\"background: #FBF8F1; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px\">\n            <div style=\"display: flex; flex-direction: column; gap: 8px\"><label style=\"font-size: 13px; color: #7E8C88\">Дата заезда<\u002Flabel><div style=\"height: 48px; padding: 0 16px; border: 1px solid #E6DFD1; border-radius: 8px; display: flex; align-items: center; font-family: Outfit; font-variant-numeric: tabular-nums; color: #16211F\">04.01.2026<\u002Fdiv><\u002Fdiv>\n            <div style=\"display: flex; flex-direction: column; gap: 8px\"><label style=\"font-size: 13px; color: #7E8C88\">Дата выезда<\u002Flabel><div style=\"height: 48px; padding: 0 16px; border: 1px solid #E6DFD1; border-radius: 8px; display: flex; align-items: center; font-family: Outfit; font-variant-numeric: tabular-nums; color: #16211F\">12.01.2026<\u002Fdiv><\u002Fdiv>\n            <div style=\"display: flex; gap: 12px\">\n              <div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px\"><label style=\"font-size: 13px; color: #7E8C88\">Взрослые<\u002Flabel><div style=\"height: 48px; padding: 0 16px; border: 1px solid #E6DFD1; border-radius: 8px; display: flex; align-items: center\">2<\u002Fdiv><\u002Fdiv>\n              <div style=\"flex: 1; display: flex; flex-direction: column; gap: 8px\"><label style=\"font-size: 13px; color: #7E8C88\">Дети<\u002Flabel><div style=\"height: 48px; padding: 0 16px; border: 1px solid #E6DFD1; border-radius: 8px; display: flex; align-items: center\">0<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height: 48px; border-radius: 12px; background: #0E4F4B; color: #F5EFE4; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600\">Найти жильё<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"padding: 40px 16px; display: flex; flex-direction: column; gap: 32px\">\n          <div><h3 style=\"font-family: Outfit; font-size: 28px; font-weight: 600; margin: 0 0 12px\">Жить<\u002Fh3><p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0\">Найдите дом, бронируйте одним нажатием, платите наличными. Без комиссий за карту.<\u002Fp><\u002Fdiv>\n          <div><h3 style=\"font-family: Outfit; font-size: 28px; font-weight: 600; margin: 0 0 12px\">Быт<\u002Fh3><p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0\">Заказывайте услуги, пишите соседям, решайте вместе. Быт становится проще.<\u002Fp><\u002Fdiv>\n          <div><h3 style=\"font-family: Outfit; font-size: 28px; font-weight: 600; margin: 0 0 12px\">Владеть<\u002Fh3><p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0\">Получайте доход. Видьте каждого гостя, каждый платёж, каждую заявку.<\u002Fp><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 8px 0 0; max-width: 390px\">The kicker drops its 2.88px tracking here and takes an 18px line-height, because <em>Жизнь с сервисом на Пхукете<\u002Fem> with full tracking wraps to three lines at 390. The three section words — Жить, Быт, Владеть — are shorter than Stay/Live/Own and hold the 28px display comfortably.<\u002Fp>\n    <\u002Fdiv>\n\n    <div>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 8px\">Property modal · booking widget · the pressure point · <em>new<\u002Fem><\u002Fp>\n      <div style=\"width: 420px; border: 1px solid #DAD1BF; border-radius: 12px; background: #F5EFE4; padding: 20px\">\n        <div style=\"border: 1px solid #E6DFD1; border-radius: 16px; background: #FBF8F1; padding: 24px\">\n          <div style=\"display: flex; align-items: baseline; gap: 8px; margin-bottom: 20px\">\n            <span style=\"font-family: Outfit; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums\">฿4,500<\u002Fspan>\n            <span style=\"font-size: 15px; color: #7E8C88\">за ночь<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"border: 1px solid #E6DFD1; border-radius: 8px; overflow: hidden; margin-bottom: 12px\">\n            <div style=\"display: grid; grid-template-columns: 1fr 1fr\">\n              <div style=\"padding: 12px 16px; border-right: 1px solid #E6DFD1\"><p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 2px\">Заезд<\u002Fp><p style=\"font-family: Outfit; font-size: 15px; font-weight: 500; margin: 0; font-variant-numeric: tabular-nums\">04.01.2026<\u002Fp><\u002Fdiv>\n              <div style=\"padding: 12px 16px\"><p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 2px\">Выезд<\u002Fp><p style=\"font-family: Outfit; font-size: 15px; font-weight: 500; margin: 0; font-variant-numeric: tabular-nums\">12.01.2026<\u002Fp><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"padding: 12px 16px; border-top: 1px solid #E6DFD1; display: flex; align-items: center; justify-content: space-between\">\n              <div><p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 2px\">Гости<\u002Fp><p style=\"font-size: 15px; font-weight: 500; margin: 0\">2 взрослых<\u002Fp><\u002Fdiv>\n              <div style=\"display: flex; align-items: center; gap: 12px\">\n                <span style=\"width: 44px; height: 44px; border-radius: 9999px; border: 1px solid #E6DFD1; display: inline-flex; align-items: center; justify-content: center; font-size: 20px\">−<\u002Fspan>\n                <span style=\"width: 44px; height: 44px; border-radius: 9999px; border: 1px solid #E6DFD1; display: inline-flex; align-items: center; justify-content: center; font-size: 20px\">+<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"padding: 12px 16px; border-radius: 8px; background: #F6ECD8; margin-bottom: 20px\">\n            <p style=\"font-size: 13px; font-weight: 600; color: #B97F1F; margin: 0\">Забронировано для вас · осталось 12:34<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"margin-bottom: 20px\">\n            <div style=\"display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px\"><span style=\"font-size: 15px\">8 ночей × ฿4,500<\u002Fspan><span style=\"font-family: Outfit; font-weight: 500; font-variant-numeric: tabular-nums; flex-shrink: 0\">฿36,000<\u002Fspan><\u002Fdiv>\n            <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 12px\">высокий сезон · правило RS-2026-HI<\u002Fp>\n            <div style=\"display: flex; justify-content: space-between; gap: 12px; margin-bottom: 8px\"><span style=\"font-size: 15px\">Уборка при выезде<\u002Fspan><span style=\"font-family: Outfit; font-weight: 500; font-variant-numeric: tabular-nums; flex-shrink: 0\">฿1,800<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px\"><span style=\"font-size: 15px\">Скидка за прямое бронирование<\u002Fspan><span style=\"font-family: Outfit; font-weight: 500; font-variant-numeric: tabular-nums; color: #AE4E38; flex-shrink: 0\">−฿1,200<\u002Fspan><\u002Fdiv>\n            <div style=\"display: flex; justify-content: space-between; padding-top: 12px; border-top: 1px solid #E6DFD1\"><span style=\"font-size: 15px; font-weight: 600\">Итого<\u002Fspan><span style=\"font-family: Outfit; font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums\">฿36,600<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"height: 56px; border-radius: 16px; background: #0E4F4B; color: #F5EFE4; display: flex; align-items: center; justify-content: center; font-family: Outfit; font-size: 16px; font-weight: 500; margin-bottom: 12px\">Забронировать<\u002Fdiv>\n          <p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 0 0 16px; text-align: center\">Оплата пока не списывается. Карта, перевод или наличные при заезде.<\u002Fp>\n          <div style=\"padding-top: 16px; border-top: 1px solid #E6DFD1\">\n            <p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 0\">Бесплатная отмена до 28 декабря · <span style=\"color: #0E4F4B; font-weight: 500\">условия flex-7<\u002Fspan><\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 8px 0 0; max-width: 420px\">Three things this forced. The card grew from 380 to 420 — the widget's width is set by <em>Скидка за прямое бронирование<\u002Fem>, the longest line-item label in either language, so 420 is now the desktop minimum. Line labels and amounts became a flex pair with <code style=\"font-family: Outfit; font-size: 13px\">flex-shrink: 0<\u002Fcode> on the figure, so a long label wraps and the number never does. <em>Забронировать<\u002Fem> is 86% longer than <em>Reserve<\u002Fem> and still fits the 56px button at 16px — which is the argument for content-width buttons over fixed ones.<\u002Fp>\n    <\u002Fdiv>\n\n    <div>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 8px\">S6 · Ваше жильё · mobile 390 · <em>new<\u002Fem><\u002Fp>\n      <div style=\"width: 390px; border: 1px solid #DAD1BF; border-radius: 12px; background: #F5EFE4; overflow: hidden\">\n        <div style=\"background: #0E4F4B; color: #F5EFE4; padding: 16px\">\n          <p style=\"font-size: 13px; margin: 0 0 4px\">С возвращением, Анна<\u002Fp>\n          <h1 style=\"font-family: Outfit; font-size: 28px; line-height: 34px; font-weight: 600; margin: 0\">Layan Green Park<\u002Fh1>\n        <\u002Fdiv>\n        <div style=\"padding: 24px 16px\">\n          <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 20px; margin-bottom: 20px\">\n            <p style=\"font-family: Outfit; font-weight: 500; font-size: 12px; line-height: 18px; text-transform: uppercase; color: #D69A3A; margin: 0 0 12px\">Ваше проживание<\u002Fp>\n            <h2 style=\"font-family: Outfit; font-size: 20px; line-height: 26px; font-weight: 600; margin: 0 0 4px\">Вилла с садом, 2 спальни · B-707<\u002Fh2>\n            <p style=\"font-family: Outfit; font-size: 15px; font-variant-numeric: tabular-nums; color: #7E8C88; margin: 0 0 16px\">4–12 января 2026 · 8 ночей<\u002Fp>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px\">\n              <span style=\"padding: 6px 12px; border-radius: 9999px; background: #E3ECEA; color: #0E4F4B; font-size: 13px; font-weight: 500\">Вы заселены<\u002Fspan>\n              <span style=\"display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 9999px; background: #E4EFE7; color: #2F7A57; font-size: 13px; font-weight: 500\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"3\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><\u002Fsvg>TM30 подан<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"padding: 16px; border-radius: 8px; background: #F5EFE4\">\n              <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 4px\">Код от двери<\u002Fp>\n              <p style=\"font-family: Outfit; font-size: 28px; font-weight: 600; letter-spacing: 4px; margin: 0; font-variant-numeric: tabular-nums\">4417<\u002Fp>\n              <p style=\"font-size: 13px; color: #7E8C88; margin: 8px 0 0\">Калитка виллы, затем клавиатура слева от двери.<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 20px\">\n            <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 12px; padding: 16px; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between\">\n              <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0E4F4B\" stroke-width=\"1.5\"><path d=\"M20 12a8 8 0 11-3.2-6.4\"><\u002Fpath><path d=\"M4 19l1.4-3.6\"><\u002Fpath><\u002Fsvg>\n              <p style=\"font-size: 15px; line-height: 21px; font-weight: 600; margin: 0\">Написать команде<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 12px; padding: 16px; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between\">\n              <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0E4F4B\" stroke-width=\"1.5\"><path d=\"M4 7h16M4 12h10M4 17h6\"><\u002Fpath><\u002Fsvg>\n              <p style=\"font-size: 15px; line-height: 21px; font-weight: 600; margin: 0\">Заказать услугу<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 12px; padding: 16px; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between\">\n              <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0E4F4B\" stroke-width=\"1.5\"><path d=\"M12 4l8 15H4z\"><\u002Fpath><path d=\"M12 10v4\"><\u002Fpath><\u002Fsvg>\n              <p style=\"font-size: 15px; line-height: 21px; font-weight: 600; margin: 0\">Сообщить о проблеме<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 12px; padding: 16px; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between\">\n              <svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0E4F4B\" stroke-width=\"1.5\"><rect x=\"4\" y=\"5\" width=\"16\" height=\"15\" rx=\"2\"><\u002Frect><path d=\"M8 3v4M16 3v4M4 10h16\"><\u002Fpath><\u002Fsvg>\n              <p style=\"font-size: 15px; line-height: 21px; font-weight: 600; margin: 0\">Продлить проживание<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-family: Outfit; font-weight: 500; font-size: 12px; line-height: 18px; text-transform: uppercase; color: #D69A3A; margin: 0 0 12px\">Ваши заказы<\u002Fp>\n          <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 12px; padding: 16px; margin-bottom: 20px\">\n            <div style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 12px\">\n              <div><p style=\"font-size: 15px; font-weight: 600; margin: 0 0 4px\">Генеральная уборка<\u002Fp><p style=\"font-size: 13px; color: #7E8C88; margin: 0\">Чт 8 янв, 10:00 · ฿1,400<\u002Fp><\u002Fdiv>\n              <span style=\"padding: 6px 12px; border-radius: 9999px; background: #E4EFE7; color: #2F7A57; font-size: 13px; font-weight: 500; flex-shrink: 0\">Принят<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <p style=\"font-family: Outfit; font-weight: 500; font-size: 12px; line-height: 18px; text-transform: uppercase; color: #D69A3A; margin: 0 0 12px\">От дома<\u002Fp>\n          <div style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 12px; padding: 16px\">\n            <div style=\"margin-bottom: 8px\">\n              <p style=\"font-size: 15px; font-weight: 600; margin: 0 0 4px\">Обслуживание бассейна в четверг<\u002Fp>\n              <span style=\"padding: 4px 10px; border-radius: 9999px; background: #FBF8F1; border: 1px solid #E6DFD1; font-size: 13px; font-weight: 500; color: #7E8C88\">Официально · Юрлицо<\u002Fspan>\n            <\u002Fdiv>\n            <p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 0\">Главный бассейн закрыт 08:00–12:00 девятого января. Садовый работает.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 8px 0 0; max-width: 390px\">The four quick actions are the clearest break: <em>Сообщить о проблеме<\u002Fem> and <em>Продлить проживание<\u002Fem> both wrap to two lines, so the tile min-height went 88 → 96 and the label took a 21px line-height. The \"Official · Juristic person\" marker no longer fits inline beside a two-line title, so it drops to its own row.<\u002Fp>\n    <\u002Fdiv>\n\n    <div>\n      <p style=\"font-size: 13px; color: #7E8C88; margin: 0 0 8px\">Ops · заезды · the row under real pressure · <em>new<\u002Fem><\u002Fp>\n      <div style=\"width: 620px; border: 1px solid #DAD1BF; border-radius: 12px; background: #F5EFE4; padding: 24px\">\n        <h1 style=\"font-family: Outfit; font-size: 28px; font-weight: 600; margin: 0 0 4px\">Сегодня · Лаян<\u002Fh1>\n        <p style=\"font-size: 15px; color: #7E8C88; margin: 0 0 20px\">Пн 4 января 2026 · 3 заезда, 2 выезда, 1 без оплаты<\u002Fp>\n        <section style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 20px; margin-bottom: 16px\">\n          <h2 style=\"font-family: Outfit; font-size: 20px; font-weight: 700; margin: 0 0 8px\">Заезды<\u002Fh2>\n          <div style=\"display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid #E6DFD1\">\n            <div style=\"flex: 1; min-width: 0\">\n              <p style=\"font-size: 15px; font-weight: 600; margin: 0\">Анна Соколова<span style=\"color: #7E8C88; font-weight: 400\"> · B-707<\u002Fspan><\u002Fp>\n              <p style=\"font-size: 13px; color: #7E8C88; margin: 0\">04.01.2026 — 12.01.2026 · 2 гостя · ฿36,600<\u002Fp>\n              <div style=\"display: flex; gap: 8px; margin-top: 6px\">\n                <span style=\"padding: 4px 10px; border-radius: 9999px; background: #E4EFE7; color: #2F7A57; font-size: 13px; font-weight: 500\">Оплачено<\u002Fspan>\n                <span style=\"padding: 4px 10px; border-radius: 9999px; background: #E4EFE7; color: #2F7A57; font-size: 13px; font-weight: 500\">Проверен<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height: 40px; padding: 0 16px; border-radius: 12px; background: #0E4F4B; color: #F5EFE4; display: flex; align-items: center; font-size: 13px; font-weight: 500; flex-shrink: 0; white-space: nowrap\">Заселить<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: 16px; padding: 16px 0\">\n            <div style=\"flex: 1; min-width: 0\">\n              <p style=\"font-size: 15px; font-weight: 600; margin: 0\">Майкл Чен<span style=\"color: #7E8C88; font-weight: 400\"> · A-204<\u002Fspan><\u002Fp>\n              <p style=\"font-size: 13px; color: #7E8C88; margin: 0\">04.01.2026 — 07.01.2026 · 4 гостя · ฿18,400<\u002Fp>\n              <div style=\"display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px\">\n                <span style=\"padding: 4px 10px; border-radius: 9999px; background: #F6ECD8; color: #B97F1F; font-size: 13px; font-weight: 500\">Без оплаты<\u002Fspan>\n                <span style=\"padding: 4px 10px; border-radius: 9999px; background: #F6ECD8; color: #B97F1F; font-size: 13px; font-weight: 500\">Не проверен<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"height: 40px; padding: 0 16px; border-radius: 12px; background: #0E4F4B; color: #F5EFE4; display: flex; align-items: center; font-size: 13px; font-weight: 500; flex-shrink: 0; white-space: nowrap; opacity: .5\">Заселить<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n        <section style=\"background: #FBF8F1; border: 1px solid #E6DFD1; border-radius: 16px; padding: 20px\">\n          <h2 style=\"font-family: Outfit; font-size: 20px; font-weight: 700; margin: 0 0 8px\">Ожидают оплаты наличными<\u002Fh2>\n          <div style=\"padding: 16px 0\">\n            <div style=\"margin-bottom: 12px\">\n              <p style=\"font-size: 15px; font-weight: 600; margin: 0\">Майкл Чен<span style=\"color: #7E8C88; font-weight: 400\"> · A-204<\u002Fspan><\u002Fp>\n              <p style=\"font-size: 13px; color: #7E8C88; margin: 0\">04.01.2026 — 07.01.2026 · ฿18,400<\u002Fp>\n            <\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 8px\">\n              <div style=\"flex: 1; height: 40px; padding: 0 12px; border: 1px solid #E6DFD1; border-radius: 8px; background: #FBF8F1; display: flex; align-items: center; font-size: 13px; color: #A7B2AE\">Номер квитанции<\u002Fdiv>\n              <div style=\"height: 40px; padding: 0 16px; border-radius: 12px; background: #D69A3A; color: #0A3733; display: flex; align-items: center; font-size: 13px; font-weight: 600; flex-shrink: 0; white-space: nowrap; opacity: .5\">Принять наличные<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n      <\u002Fdiv>\n      <p style=\"font-size: 13px; line-height: 19px; color: #7E8C88; margin: 8px 0 0; max-width: 620px\">The ops row broke and had to change. In English the paid/verified pair fits on the meta line as plain text; in Russian <em>Без оплаты · Не проверен<\u002Fem> collides with the action, so both languages now render them as wrapping chips on their own row — better in English too, since the status is what the person is scanning for. The action gets <code style=\"font-family: Outfit; font-size: 13px\">flex-shrink: 0<\u002Fcode> and <code style=\"font-family: Outfit; font-size: 13px\">white-space: nowrap<\u002Fcode>; <em>Принять наличные<\u002Fem> at 45% longer is why the receipt field became flexible instead of a fixed 160px.<\u002Fp>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div style=\"background: #0A3733; border-radius: 16px; padding: 32px; color: #EAF2F0; max-width: 1180px; margin: 32px 0 0\">\n    <p style=\"font-family: Outfit; font-size: 20px; font-weight: 600; margin: 0 0 4px\">Seven rules for the translation pass<\u002Fp>\n    <p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0 0 24px; max-width: 720px\">These are what came out of drawing the journey twice. Applying them makes TH a translation rather than another redesign.<\u002Fp>\n    <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px 32px\">\n      <div><p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 6px\">1 · No fixed-width buttons<\u002Fp><p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0\">Content plus padding, with a min-width. Never a width measured from the English label.<\u002Fp><\u002Fdiv>\n      <div><p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 6px\">2 · Labels wrap, figures do not<\u002Fp><p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0\">Every label-and-amount pair is a flex row with <code style=\"font-family: Outfit; font-size: 13px\">flex-shrink: 0<\u002Fcode> on the number.<\u002Fp><\u002Fdiv>\n      <div><p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 6px\">3 · Status chips wrap, never truncate<\u002Fp><p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0\">A cut-off status is unreadable. Give them their own row and let the row grow.<\u002Fp><\u002Fdiv>\n      <div><p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 6px\">4 · Tracking is a display-size luxury<\u002Fp><p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0\">The kicker's 2.88px drops below <code style=\"font-family: Outfit; font-size: 13px\">md<\u002Fcode> in RU and TH; line-height goes 16 → 18.<\u002Fp><\u002Fdiv>\n      <div><p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 6px\">5 · Two lines is the design target<\u002Fp><p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0\">Any tile or chip that fits exactly one line in English will wrap somewhere. Size for two.<\u002Fp><\u002Fdiv>\n      <div><p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 6px\">6 · Dates and money are locale-formatted<\u002Fp><p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0\">Same tabular Outfit figures, locale month names, ฿ kept — owners bank in baht whatever they read in.<\u002Fp><\u002Fdiv>\n      <div><p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 6px\">7 · Names and codes are never translated<\u002Fp><p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0\">B-707, Layan Green Park, flex-7, RS-2026-HI, TM30. A guest reads them to staff aloud.<\u002Fp><\u002Fdiv>\n      <div><p style=\"font-family: Outfit; font-size: 16px; font-weight: 600; margin: 0 0 6px\">And one for review<\u002Fp><p style=\"font-size: 15px; line-height: 23px; color: #7FA39D; margin: 0\">No locale ships partially. The content editor's per-locale review state is the gate — an untranslated key falls back to EN and is visibly flagged, never silently English.<\u002Fp><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding: 40px 56px 80px; border-top: 1px solid #DAD1BF\">\n  <h2 style=\"font-family: Outfit; font-weight: 600; font-size: 20px; line-height: 26px; margin: 0 0 16px\">Notes and open decisions<\u002Fh2>\n  <div style=\"display: flex; flex-wrap: wrap; gap: 32px; max-width: 1180px\">\n    <div style=\"flex: 1 1 320px\">\n      <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0 0 12px\">Drawn so far: every surface you named, all nine flows, the schemas, and 60-odd screens. Four gaps remain against the brief, in the order I would close them.<\u002Fp>\n      <ol style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0; padding-left: 20px\">\n        <li style=\"margin-bottom: 8px\"><strong style=\"color: #16211F\">Mobile counterparts.<\u002Fstrong> Done in board 20 — ops (including the cash sheet), owner and statement, provider queue, CRM, admin, messages, MC and juristic, with the desktop-to-390 rules written out beneath them.<\u002Fli>\n        <li style=\"margin-bottom: 8px\"><strong style=\"color: #16211F\">Russian.<\u002Fstrong> Done in board 21 — the guest journey end to end, the measured length deltas, three layout changes it forced, and seven rules that make TH a translation rather than another redesign.<\u002Fli>\n        <li style=\"margin-bottom: 8px\"><strong style=\"color: #16211F\">The routes named but not drawn.<\u002Fstrong> Auth is now done in board 18. Remaining: trips list and trip detail, account, tickets list and new-ticket, orders list and order detail, passports, handbook; the public marketing pages — projects, project detail, trust, ombudsman, about, and the six audience doors; and the eight admin lists that appear in the sidebar without a screen of their own: projects, units, bookings, provider vetting, service submissions, statements, claims, disputes.<\u002Fli>\n        <li><strong style=\"color: #16211F\">Per-screen empty, loading and error.<\u002Fstrong> Board 19's coverage matrix now names every gap surface by surface. Twenty-two states to draw; the copy differs every time, so none of them is a copy-paste.<\u002Fli>\n      <\u002Fol>\n    <\u002Fdiv>\n    <div style=\"flex: 1 1 320px\">\n      <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0\">Copy is drawn in English with Russian shown where it changes the layout — the content editor board and the type specimen. Every string on these screens is a content key, so RU and TH are a translation pass, not a redesign. Cyrillic is covered by both Outfit and Manrope; Thai falls back to Noto Sans Thai.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"flex: 1 1 320px\">\n      <p style=\"font-size: 15px; line-height: 23px; color: #7E8C88; margin: 0\">Two pieces of drift are now resolved on the canvas: the CRM is drawn on the token system in board 10, with a change table naming each substitution, and the juristic board in board 08 is corrected — status chips instead of raw enums, type.small instead of the undefined <code style=\"font-family: Outfit; font-size: 13px\">text-xsmall<\u002Fcode>. Still open, and needing your call rather than mine: the landing sets its ground to white rather than ivory and uses a plain check glyph for the trust points, and <code style=\"font-family: Outfit; font-size: 13px\">globals.css<\u002Fcode> carries a Tailwind dark-mode body rule the product does not ship.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
