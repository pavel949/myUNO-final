name: CI Runner Diagnostic

on:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm GitHub-hosted runner allocation
        run: |
          echo "runner-ok"
          echo "os=$(uname -a)"
          node --version || true
          npm --version || true
          docker --version || true
